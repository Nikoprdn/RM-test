<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Monaco — The sound of Monte-Carlo</title>
<meta name="description" content="Radio Monaco : le direct de Monte-Carlo, Paris, 100 % Mix DJ et Night Mood. 98.2 FM Monaco, DAB+, appli et SiriusXM.">
<meta name="theme-color" content="#F6F3EE">
<style>
@font-face{font-family:'Barlow';src:url(assets/Barlow-Light.ttf) format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-Regular.ttf) format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-Medium.ttf) format('truetype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-SemiBold.ttf) format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-Bold.ttf) format('truetype');font-weight:700;font-style:normal;font-display:swap}
body{margin:0;background:#F6F3EE}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.rm *,.rm *::before,.rm *::after{box-sizing:border-box}
.rm button{font-family:inherit}
.rm :focus-visible{outline:2px solid #E4032E;outline-offset:3px}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.hdr{transition:background .5s ease,color .5s ease,border-color .5s ease}
.nav a{position:relative;opacity:.85;transition:opacity .25s}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.16,.84,.12,1)}
.nav a:hover{opacity:1}
.nav a:hover::after{transform:scaleX(1);transform-origin:left}

.btn{transition:transform .35s cubic-bezier(.2,.8,.1,1),box-shadow .35s,background .3s,color .3s,border-color .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(20,18,24,.4)}
.more .arrow{transition:transform .45s cubic-bezier(.2,.8,.1,1)}
.more:hover .arrow{transform:translateX(5px)}
.nb{transition:background .3s,color .3s,border-color .3s}
.nb:hover{background:#141218 !important;color:#fff !important;border-color:#141218 !important}

/* hero slideshow */
.hs{transition:opacity 1.8s ease}
@keyframes kenburns{from{transform:scale(1.16) translate3d(0,0,0)}to{transform:scale(1.02) translate3d(-1%,-1%,0)}}
.kb-on{animation:kenburns 7.5s cubic-bezier(.2,.6,.2,1) both}
.cap{transition:opacity .9s ease,transform .9s cubic-bezier(.16,.84,.12,1)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{position:relative;display:block;height:2px;background:rgba(255,255,255,.3);overflow:hidden;border-radius:2px}
.bar i{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.bar.on i{animation:fill 6s linear both}
.bar.dark{background:rgba(20,18,24,.14)}
.bar.dark i{background:#141218}
.bar.dark.on i{animation-duration:7s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp 1.3s cubic-bezier(.16,.84,.12,1) both}
.f1{animation-delay:3.4s}.f2{animation-delay:3.8s}.f3{animation-delay:4.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.vid{animation:fadeIn .8s ease .25s both}

/* eq + live */
@keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
.eq{display:flex;align-items:flex-end;gap:3px;height:14px}
.eq i{display:block;width:3px;height:100%;background:currentColor;border-radius:2px;transform-origin:bottom;animation:eq 1s ease-in-out infinite;animation-play-state:var(--eq,running)}
.eq i:nth-child(2){animation-duration:.78s;animation-delay:-.3s}
.eq i:nth-child(3){animation-duration:1.15s;animation-delay:-.6s}
.eq i:nth-child(4){animation-duration:.9s;animation-delay:-.15s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,3,46,.5)}100%{box-shadow:0 0 0 10px rgba(228,3,46,0)}}
.live-dot{display:inline-block;flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#E4032E;animation:pulse 1.8s ease-out infinite}

/* tiles */
.tile .ph{transition:transform 1.4s cubic-bezier(.16,.84,.12,1)}
.tile:hover .ph{transform:scale(1.06)}
.tile .pb{transition:transform .5s cubic-bezier(.16,.84,.12,1)}
.tile:hover .pb{transform:scale(1.1)}
.radio{transition:transform .5s cubic-bezier(.16,.84,.12,1),box-shadow .5s}
.radio:hover{transform:translateY(-4px)}
.row{transition:padding .55s cubic-bezier(.16,.84,.12,1)}
.row:hover{padding-left:12px}
.row .rt{transition:color .3s}
.row:hover .rt{color:#C8022A}

/* sliders */
.scroller{scrollbar-width:none;scroll-behavior:smooth}
.scroller::-webkit-scrollbar{display:none}
.slide{transition:opacity 1.1s ease,transform 1.2s cubic-bezier(.16,.84,.12,1)}
.reel .ov{transition:opacity .4s}
.reel:hover .ov{opacity:1 !important}
.thumb{transition:opacity .35s,transform .5s cubic-bezier(.16,.84,.12,1)}
.thumb:hover{opacity:1 !important}

@keyframes reveal{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 50%}
}
.motion-off *,.motion-off *::before,.motion-off *::after{animation:none !important;transition:none !important}
@media (prefers-reduced-motion: reduce){.rm *,.rm *::before,.rm *::after{animation:none !important;transition:none !important}}
@media (max-width: 1000px){.nav{display:none !important}}
@media (max-width: 640px){.hide-sm{display:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="rm {{motionClass}}" style="min-height: 100vh; display: flex; flex-direction: column; background: #F6F3EE; color: #141218; font-family: 'Barlow', 'Helvetica Neue', Helvetica, sans-serif; overflow-x: clip; padding-bottom: 96px; --eq: {{eqState}}">

<!-- HEADER -->
<header class="hdr" style="position: sticky; top: 0; z-index: 60; height: 84px; margin-bottom: -84px; color: {{hdr.fg}}; background: {{hdr.bg}}; border-bottom: 1px solid {{hdr.line}}; backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4)">
<div style="max-width: 1400px; height: 100%; margin: 0 auto; padding: 0 clamp(24px,4vw,56px); display: flex; align-items: center; justify-content: space-between; gap: 32px">
<a href="#top" aria-label="Radio Monaco — accueil" style="display: flex; align-items: center; flex-shrink: 0">
<sc-if value="{{hdr.light}}" hint-placeholder-val="{{ true }}"><img src="assets/rm-logo-white.png" alt="Radio Monaco" style="height: 36px; width: auto; display: block"></sc-if>
<sc-if value="{{hdr.dark}}" hint-placeholder-val="{{ false }}"><img src="assets/rm-logo-ink.png" alt="Radio Monaco" style="height: 36px; width: auto; display: block"></sc-if>
</a>
<nav class="nav" aria-label="Navigation principale" style="display: flex; align-items: center; gap: 34px; font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase">
<a href="#radios">Radios</a>
<a href="#actualites">Actualités</a>
<a href="#reseaux">Réseaux</a>
<a href="#equipes">Équipes</a>
<a href="#djs">DJs</a>
<a href="#podcasts">Podcasts</a>
</nav>
<button class="btn" onClick="{{togglePlay}}" style="display: inline-flex; align-items: center; gap: 11px; height: 44px; padding: 0 20px 0 17px; border: 0; border-radius: 999px; background: {{hdr.btnBg}}; color: {{hdr.btnFg}}; font-size: 14px; font-weight: 500; cursor: pointer">
<span class="live-dot"></span><span>{{headerLabel}}</span>
</button>
</div>
</header>

<!-- HERO SLIDESHOW -->
<section id="top" style="position: relative; height: 900px; overflow: hidden; color: #FFFFFF; background: #1E2129">
<img class="hs {{hero.k0}}" src="assets/rm-monaco-port.jpg" alt="Le port Hercule et Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; opacity: {{hero.o0}}">
<img class="hs {{hero.k1}}" src="assets/rm-monaco-baie.jpg" alt="La baie de Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%; opacity: {{hero.o1}}">
<img class="hs {{hero.k2}}" src="assets/rm-night.jpg" alt="Monaco de nuit" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; opacity: {{hero.o2}}">
<img class="hs {{hero.k3}}" src="assets/rm-casino.jpg" alt="Le Casino de Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; opacity: {{hero.o3}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,14,22,.52) 0%, rgba(12,14,22,.26) 35%, rgba(12,14,22,.28) 62%, rgba(12,14,22,.62) 100%)"></div>

<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px 120px">
<div class="vid" style="width: min(880px, 100%); aspect-ratio: 16 / 9; margin: -20px 0 -112px">
<video ref="{{videoRef}}" autoplay muted playsinline preload="auto" aria-label="Logo Radio Monaco animé" style="width: 100%; height: 100%; display: block; mix-blend-mode: screen">
<source src="assets/rm-intro.webm" type="video/webm">
<source src="assets/rm-intro.mp4" type="video/mp4">
</video>
</div>
<p class="fade f1" style="margin: 0; padding-left: .44em; font-size: clamp(13px, 1.25vw, 17px); font-weight: 500; letter-spacing: .44em; text-transform: uppercase">The sound of Monte-Carlo</p>
<button class="btn fade f2" onClick="{{togglePlay}}" style="margin-top: 44px; display: inline-flex; align-items: center; gap: 14px; height: 56px; padding: 0 28px 0 8px; border: 0; border-radius: 999px; background: #FFFFFF; color: #141218; font-size: 15px; font-weight: 600; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #E4032E; color: #fff; display: inline-flex; align-items: center; justify-content: center">
<sc-if value="{{notPlaying}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></sc-if>
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"></path></svg></sc-if>
</span>
<span>{{heroLabel}}</span>
</button>
</div>

<!-- slide caption + progress -->
<div class="fade f3" style="position: absolute; left: 0; right: 0; bottom: 36px">
<div style="max-width: 1400px; margin: 0 auto; padding: 0 clamp(24px,4vw,56px); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 40px">
<div style="position: relative; height: 44px; min-width: 260px; flex: 1 1 260px">
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o0}}; transform: translateY({{hero.t0}}px); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8">01 / 04</span><span style="font-size: 16px; font-weight: 500">Le port Hercule</span></span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o1}}; transform: translateY({{hero.t1}}px); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8">02 / 04</span><span style="font-size: 16px; font-weight: 500">La baie de Monaco</span></span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o2}}; transform: translateY({{hero.t2}}px); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8">03 / 04</span><span style="font-size: 16px; font-weight: 500">Monaco, la nuit</span></span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o3}}; transform: translateY({{hero.t3}}px); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8">04 / 04</span><span style="font-size: 16px; font-weight: 500">Le Casino de Monte-Carlo</span></span>
</div>
<div style="flex: 0 1 260px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button onClick="{{hero.go0}}" aria-label="Photo 1" style="height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar {{hero.b0}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go1}}" aria-label="Photo 2" style="height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar {{hero.b1}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go2}}" aria-label="Photo 3" style="height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar {{hero.b2}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go3}}" aria-label="Photo 4" style="height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar {{hero.b3}}" style="width: 100%"><i></i></span></button>
</div>
</div>
</div>
</section>

<!-- 01 · RADIOS (compact) -->
<section id="radios" style="padding: 72px 0 0">
<div style="max-width: 1400px; margin: 0 auto; padding: 0 clamp(24px,4vw,56px)">
<div class="reveal" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px 32px; margin-bottom: 24px">
<p style="margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: #6A6570">01 — Nos radios en direct</p>
<p style="margin: 0; font-size: 14px; color: #6A6570">Cliquez pour écouter</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(250px, 100%), 1fr)); gap: 12px">
<sc-for list="{{radios}}" as="r" hint-placeholder-count="4">
<button class="radio tile reveal" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" style="position: relative; height: 128px; border: 0; padding: 0; border-radius: 18px; overflow: hidden; cursor: pointer; text-align: left; color: #fff; background: #141218; box-shadow: {{r.ring}}">
<img class="ph" src="{{r.photo}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{r.pos}}">
<span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20,18,24,.82) 0%, rgba(20,18,24,.45) 60%, rgba(20,18,24,.25) 100%)"></span>
<span style="position: absolute; inset: 0; padding: 0 16px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<img src="{{r.logo}}" alt="{{r.alt}}" style="width: min(150px, 62%); height: auto; display: block">
<span class="pb" style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: {{r.color}}; color: {{r.ink}}; display: inline-flex; align-items: center; justify-content: center">
<sc-if value="{{r.eq}}" hint-placeholder-val="{{ false }}"><span class="eq"><i></i><i></i><i></i><i></i></span></sc-if>
<sc-if value="{{r.play}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></sc-if>
</span>
</span>
</button>
</sc-for>
</div>
</div>
</section>

<!-- 02 · ACTUALITÉS (slider) -->
<section id="actualites" style="padding: 140px 0 0">
<div style="max-width: 1400px; margin: 0 auto; padding: 0 clamp(24px,4vw,56px)">
<div class="reveal" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px 40px; margin-bottom: 44px">
<div>
<p style="margin: 0 0 18px; font-size: 12px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: #6A6570">02 — Actualités</p>
<h2 style="margin: 0; font-size: clamp(40px, 4.8vw, 68px); line-height: 1; letter-spacing: -0.03em; font-weight: 300">À la <span style="font-weight: 600">une.</span></h2>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<button class="nb" onClick="{{news.prev}}" aria-label="Actualité précédente" style="width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(20,18,24,.2); background: transparent; color: #141218; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<button class="nb" onClick="{{news.next}}" aria-label="Actualité suivante" style="width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(20,18,24,.2); background: transparent; color: #141218; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div class="reveal" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr)); gap: 32px 64px; align-items: center">
<a href="#" class="tile" style="position: relative; display: block; aspect-ratio: 16 / 11; border-radius: 22px; overflow: hidden; background: #D8CBB4">
<img class="slide ph" src="assets/rm-casino.jpg" alt="L’Opéra Garnier de Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; opacity: {{news.o0}}">
<img class="slide ph" src="assets/rm-monaco-port.jpg" alt="Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{news.o1}}">
<img class="slide ph" src="assets/rm-monaco-baie.jpg" alt="Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 60%; opacity: {{news.o2}}">
</a>
<div style="display: flex; flex-direction: column; gap: 28px">
<div style="position: relative; min-height: 250px">
<a href="#" class="slide" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px; opacity: {{news.o0}}; transform: translateY({{news.t0}}px); pointer-events: {{news.p0}}">
<span style="font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #C8022A">Musique · 18 — 29 novembre</span>
<span style="font-size: clamp(30px, 3vw, 44px); font-weight: 400; letter-spacing: -0.025em; line-height: 1.1">Monte-Carlo Jazz Festival 2026 : 20 ans de passion à l’Opéra Garnier</span>
<span class="more" style="display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500">Lire l’article<svg class="ic arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
<a href="#" class="slide" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px; opacity: {{news.o1}}; transform: translateY({{news.t1}}px); pointer-events: {{news.p1}}">
<span style="font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #C8022A">Monaco</span>
<span style="font-size: clamp(30px, 3vw, 44px); font-weight: 400; letter-spacing: -0.025em; line-height: 1.1">Budget rectificatif 2026 : le Conseil National dit oui après des avancées sur l’emploi et le logement</span>
<span class="more" style="display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500">Lire l’article<svg class="ic arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
<a href="#" class="slide" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px; opacity: {{news.o2}}; transform: translateY({{news.t2}}px); pointer-events: {{news.p2}}">
<span style="font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #C8022A">À la une</span>
<span style="font-size: clamp(30px, 3vw, 44px); font-weight: 400; letter-spacing: -0.025em; line-height: 1.1">Planetary Health Awards 2026 : la Fondation Prince Albert II fête ses 20 ans</span>
<span class="more" style="display: inline-flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500">Lire l’article<svg class="ic arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 360px">
<button onClick="{{news.go0}}" aria-label="Actualité 1" style="height: 30px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar dark {{news.b0}}" style="width: 100%"><i></i></span></button>
<button onClick="{{news.go1}}" aria-label="Actualité 2" style="height: 30px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar dark {{news.b1}}" style="width: 100%"><i></i></span></button>
<button onClick="{{news.go2}}" aria-label="Actualité 3" style="height: 30px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar dark {{news.b2}}" style="width: 100%"><i></i></span></button>
</div>
</div>
</div>

<div class="reveal" style="margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 0 40px">
<sc-for list="{{headlines}}" as="n" hint-placeholder-count="3">
<a href="#" class="row" style="display: flex; flex-direction: column; gap: 10px; padding: 26px 0; border-top: 1px solid rgba(20,18,24,.12)">
<span style="font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: #6A6570">{{n.cat}}</span>
<span class="rt" style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3">{{n.title}}</span>
</a>
</sc-for>
</div>
</div>
</section>

<!-- 03 · SUR NOS RÉSEAUX (reels slider) -->

<script>
/* Mini moteur de rendu (compatible avec la maquette Design) : {{ }}, <sc-if>, <sc-for>, événements, refs. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(u, cb) {
    const p = typeof u === 'function' ? u(this.state, this.props) : u;
    if (p) this.state = Object.assign({}, this.state, p);
    if (this.__schedule) this.__schedule();
    if (cb) cb();
  }
  forceUpdate() { if (this.__schedule) this.__schedule(); }
}
function DCRender(Comp, tpl, mount, props) {
  const inst = new Comp(props || {});
  if (!inst.state) inst.state = {};
  const root = { vars: {}, parent: null };
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const lit = (s) => {
    if (s === 'true') return true;
    if (s === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
    if (/^'.*'$/.test(s) || /^".*"$/.test(s)) return s.slice(1, -1);
    return undefined;
  };
  const resolve = (path, ctx) => {
    const l = lit(path);
    if (l !== undefined) return l;
    const segs = path.split('.');
    let c = ctx, base;
    while (c) {
      if (c.vars && Object.prototype.hasOwnProperty.call(c.vars, segs[0])) { base = c.vars[segs[0]]; break; }
      c = c.parent;
    }
    if (!c) return undefined;
    for (let i = 1; i < segs.length; i++) { if (base == null) return undefined; base = base[segs[i]]; }
    return base;
  };
  const interp = (str, ctx) => str.replace(HOLE, (_, p) => { const v = resolve(p, ctx); return v == null ? '' : String(v); });
  const whole = (str) => { const m = (str || '').match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m ? m[1] : null; };
  const EV = { onclick: 'click', onmouseenter: 'mouseenter', onmouseleave: 'mouseleave', onchange: 'input', oninput: 'input', onfocus: 'focus', onblur: 'blur' };

  function compileChildren(parent, ctx, out) { Array.from(parent.childNodes).forEach((n) => compileNode(n, ctx, out)); }
  function compileNode(n, ctx, out) {
    if (n.nodeType === 3) {
      if (n.nodeValue.indexOf('{{') >= 0) {
        const t = n.nodeValue;
        const f = () => { const v = interp(t, ctx); if (n.nodeValue !== v) n.nodeValue = v; };
        f(); out.push(f);
      }
      return;
    }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    if (tag === 'sc-if' || tag === 'sc-for') { block(n, tag, ctx, out); return; }
    Array.from(n.attributes).forEach((a) => {
      const name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) { n.removeAttribute(name); return; }
      if (val.indexOf('{{') < 0) return;
      if (EV[name]) {
        const p = whole(val); n.removeAttribute(name);
        n.addEventListener(EV[name], (e) => { const fn = resolve(p, ctx); if (typeof fn === 'function') fn(e); });
        return;
      }
      if (name === 'ref') {
        const p = whole(val); n.removeAttribute(name);
        const f = () => { const fn = resolve(p, ctx); if (typeof fn === 'function') fn(n); };
        f(); out.push(f);
        return;
      }
      const f = () => { const v = interp(val, ctx); if (n.getAttribute(name) !== v) n.setAttribute(name, v); };
      f(); out.push(f);
    });
    compileChildren(n, ctx, out);
  }
  function block(n, tag, ctx, out) {
    const anchor = document.createComment(tag);
    n.parentNode.replaceChild(anchor, n);
    const frag = n.ownerDocument.createDocumentFragment();
    while (n.firstChild) frag.appendChild(n.firstChild);
    const remove = (nodes) => nodes.forEach((x) => x.parentNode && x.parentNode.removeChild(x));
    if (tag === 'sc-if') {
      const p = whole(n.getAttribute('value')) || 'false';
      let cur = null;
      const f = () => {
        const on = !!resolve(p, ctx);
        if (on && !cur) {
          const c = frag.cloneNode(true), b = [];
          compileChildren(c, ctx, b);
          cur = { nodes: Array.from(c.childNodes), b };
          anchor.parentNode.insertBefore(c, anchor);
        } else if (on && cur) { cur.b.forEach((x) => x()); }
        else if (!on && cur) { remove(cur.nodes); cur = null; }
      };
      f(); out.push(f);
    } else {
      const p = whole(n.getAttribute('list'));
      const as = n.getAttribute('as') || 'item';
      const items = [];
      const f = () => {
        const list = resolve(p, ctx) || [];
        for (let i = 0; i < list.length; i++) {
          if (items[i]) { items[i].ctx.vars[as] = list[i]; items[i].ctx.vars.$index = i; items[i].b.forEach((x) => x()); }
          else {
            const c2 = { vars: { [as]: list[i], $index: i }, parent: ctx };
            const c = frag.cloneNode(true), b = [];
            compileChildren(c, c2, b);
            items.push({ ctx: c2, b, nodes: Array.from(c.childNodes) });
            anchor.parentNode.insertBefore(c, anchor);
          }
        }
        while (items.length > list.length) remove(items.pop().nodes);
      };
      f(); out.push(f);
    }
  }

  const content = tpl.content.cloneNode(true);
  const binders = [];
  root.vars = inst.renderVals() || {};
  compileChildren(content, root, binders);
  mount.appendChild(content);
  let queued = false;
  inst.__schedule = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; root.vars = inst.renderVals() || {}; binders.forEach((f) => f()); });
  };
  if (inst.componentDidMount) inst.componentDidMount();
  return inst;
}


class Component extends DCLogic {
  componentDidMount() {
    this._sc = this._sc || {};
    this._hold = this._hold || {};
    this._t = setInterval(() => this.setState({ tick: Date.now() }), 30000);
    this._hero = setInterval(() => this.setState((s) => ({ hero: (((s && s.hero) || 0) + 1) % 4 })), 6000);
    this._news = setInterval(() => this.setState((s) => ({ news: (((s && s.news) || 0) + 1) % 3 })), 7000);
    this._team = setInterval(() => {
      if (this._teamHold && Date.now() - this._teamHold < 15000) return;
      this.setState((s) => ({ team: (((s && s.team) || 0) + 1) % 4 }));
    }, 5000);
    this._auto = setInterval(() => {
      ['reels', 'djs', 'pods'].forEach((k) => {
        const el = this._sc[k];
        if (!el || this._hold[k]) return;
        const max = el.scrollWidth - el.clientWidth;
        if (max <= 4) return;
        const card = el.querySelector('[data-card]');
        const step = (card ? card.offsetWidth : 280) + 14;
        if (el.scrollLeft >= max - 4) el.scrollTo({ left: 0, behavior: 'smooth' });
        else el.scrollBy({ left: step, behavior: 'smooth' });
      });
    }, 3600);
    this._onScroll = () => {
      const y = window.scrollY || (document.scrollingElement && document.scrollingElement.scrollTop) || 0;
      const s = y > 80;
      if (s !== !!(this.state && this.state.scrolled)) this.setState({ scrolled: s });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }
  componentWillUnmount() {

      el.scrollBy({ left: dir * ((card ? card.offsetWidth : 280) + 14), behavior: 'smooth' });
    };
    return {
      ref: (el) => { this._sc[k] = el; },
      hold: () => { this._hold[k] = true; },

      next: move(1)

    });
    const TT = [
      { label: 'Léo Barraband', img: 'assets/team-leo.jpg', pos: '50% 30%' },

    ];
    const teamThumbs = TT.map((t, i) => ({
      ...t,

      ring: i === teamI ? '0 0 0 2px #F6F3EE, 0 0 0 3px #141218' : 'none',

    }));

    const R = [
      { name: 'Monte-Carlo', aria: 'Écouter Radio Monaco Monte-Carlo', alt: 'Radio Monaco Monte Carlo', photo: 'assets/rm-monaco-baie.jpg', pos: '30% 60%', logo: 'assets/wr-montecarlo-white.png', color: '#E4032E', ink: '#FFFFFF', line: now.name },
      { name: 'Paris', aria: 'Écouter Radio Monaco Paris', alt: 'Radio Monaco Paris', photo: 'assets/rm-paris.jpg', pos: '50% 45%', logo: 'assets/wr-paris-white.png', color: '#FFFFFF', ink: '#141218', line: 'La webradio Radio Monaco' },
      { name: '100 % Mix DJ', aria: 'Écouter Radio Monaco 100 % Mix DJ', alt: 'Radio Monaco 100 % Mix DJ', photo: 'assets/rm-dj.jpg', pos: '62% 50%', logo: 'assets/wr-mixdj-white.png', color: '#F59C00', ink: '#141218', line: 'DJ sets non-stop' },

      { title: 'L’horoscope du jour', sub: 'Les 12 signes, chaque matin', tag: 'Horoscope', img: 'assets/rm-night.jpg', pos: '50% 40%' },

      { title: 'Deelighted by La Cartoucherie', sub: '100 % Mix DJ', tag: 'DJ set', img: 'assets/show-deelighted.jpg', pos: '70% 50%' },

    };
