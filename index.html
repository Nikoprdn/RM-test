<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Monaco — The sound of Monte-Carlo</title>
<meta name="description" content="Radio Monaco : le direct de Monte-Carlo, Paris, 100 % Mix DJ et Night Mood. 98.2 FM Monaco, DAB+, appli et SiriusXM.">
<meta name="theme-color" content="#F6F3EE">
<style>
@font-face{font-family:'Barlow';src:url(assets/Barlow-Light.ttf) format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-Regular.ttf) format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-Medium.ttf) format('truetype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-SemiBold.ttf) format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-Bold.ttf) format('truetype');font-weight:700;font-style:normal;font-display:swap}
body{margin:0;background:#F6F3EE}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.rm *,.rm *::before,.rm *::after{box-sizing:border-box}
.rm button{font-family:inherit}
.rm :focus-visible{outline:2px solid #E4032E;outline-offset:3px}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.hdr{transition:background .5s ease,color .5s ease,border-color .5s ease}
.nav a{position:relative;opacity:.85;transition:opacity .25s}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s cubic-bezier(.16,.84,.12,1)}
.nav a:hover{opacity:1}
.nav a:hover::after{transform:scaleX(1);transform-origin:left}

.btn{transition:transform .35s cubic-bezier(.2,.8,.1,1),box-shadow .35s,background .3s,color .3s,border-color .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(20,18,24,.4)}
.more .arrow{transition:transform .45s cubic-bezier(.2,.8,.1,1)}
.more:hover .arrow{transform:translateX(5px)}
.nb{transition:background .3s,color .3s,border-color .3s}
.nb:hover{background:#141218 !important;color:#fff !important;border-color:#141218 !important}

/* hero slideshow */
.hs{transition:opacity 1.8s ease}
@keyframes kenburns{from{transform:scale(1.16) translate3d(0,0,0)}to{transform:scale(1.02) translate3d(-1%,-1%,0)}}
.kb-on{animation:kenburns 7.5s cubic-bezier(.2,.6,.2,1) both}
.cap{transition:opacity .9s ease,transform .9s cubic-bezier(.16,.84,.12,1)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{position:relative;display:block;height:2px;background:rgba(255,255,255,.3);overflow:hidden;border-radius:2px}
.bar i{position:absolute;inset:0;background:#fff;transform:scaleX(0);transform-origin:left}
.bar.on i{animation:fill 6s linear both}
.bar.dark{background:rgba(20,18,24,.14)}
.bar.dark i{background:#141218}
.bar.dark.on i{animation-duration:7s}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp 1.3s cubic-bezier(.16,.84,.12,1) both}
.f1{animation-delay:3.4s}.f2{animation-delay:3.8s}.f3{animation-delay:4.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.vid{animation:fadeIn .8s ease .25s both}

/* eq + live */
@keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
.eq{display:flex;align-items:flex-end;gap:3px;height:14px}
.eq i{display:block;width:3px;height:100%;background:currentColor;border-radius:2px;transform-origin:bottom;animation:eq 1s ease-in-out infinite;animation-play-state:var(--eq,running)}
.eq i:nth-child(2){animation-duration:.78s;animation-delay:-.3s}
.eq i:nth-child(3){animation-duration:1.15s;animation-delay:-.6s}
.eq i:nth-child(4){animation-duration:.9s;animation-delay:-.15s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,3,46,.5)}100%{box-shadow:0 0 0 10px rgba(228,3,46,0)}}
.live-dot{display:inline-block;flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#E4032E;animation:pulse 1.8s ease-out infinite}

/* tiles */
.tile .ph{transition:transform 1.4s cubic-bezier(.16,.84,.12,1)}
.tile:hover .ph{transform:scale(1.06)}
.tile .pb{transition:transform .5s cubic-bezier(.16,.84,.12,1)}
.tile:hover .pb{transform:scale(1.1)}
.radio{transition:transform .5s cubic-bezier(.16,.84,.12,1),box-shadow .5s}
.radio:hover{transform:translateY(-4px)}
.row{transition:padding .55s cubic-bezier(.16,.84,.12,1)}
.row:hover{padding-left:12px}
.row .rt{transition:color .3s}
.row:hover .rt{color:#C8022A}


/* radio cards (A1) */
.rc{transition:transform .6s cubic-bezier(.16,.84,.12,1),box-shadow .6s cubic-bezier(.16,.84,.12,1),background .4s}
.rc:hover{transform:translateY(-4px)}
.rc .cv{transition:transform .8s cubic-bezier(.16,.84,.12,1)}
.rc:hover .cv{transform:scale(1.05)}
.rc .pl{transition:transform .5s cubic-bezier(.16,.84,.12,1),background .3s,color .3s}
.rc:hover .pl{transform:scale(1.08)}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.wave{display:flex;align-items:flex-end;gap:3px;height:14px;overflow:hidden}
.wave i{flex:1 1 0;min-width:2px;height:100%;border-radius:2px;background:currentColor;transform-origin:bottom;animation:wave 1.2s ease-in-out infinite}
.wave.idle i{animation:none;transform:scaleY(.14);opacity:.3}

/* sliders */
.scroller{scrollbar-width:none;scroll-behavior:smooth}
.scroller::-webkit-scrollbar{display:none}
.slide{transition:opacity 1.1s ease,transform 1.2s cubic-bezier(.16,.84,.12,1)}
.reel .ov{transition:opacity .4s}
.reel:hover .ov{opacity:1 !important}
.thumb{transition:opacity .35s,transform .5s cubic-bezier(.16,.84,.12,1)}
.thumb:hover{opacity:1 !important}

@keyframes reveal{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 50%}
}

/* ===== Navigation & transitions entre rubriques ===== */
html{scroll-behavior:auto}
.nav{position:relative}
.nav a.on{opacity:1}
.nav a.on::after{opacity:0}
.nav .ind{position:absolute;left:0;bottom:-9px;height:2px;border-radius:2px;background:#E4032E;pointer-events:none;transition:transform 1s cubic-bezier(.65,0,.12,1),width 1s cubic-bezier(.65,0,.12,1),opacity .5s ease}
.prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#E4032E;transform-origin:left;transform:scaleX(var(--rm-p,0));pointer-events:none;transition:opacity .5s ease}

/* titres : révélés derrière un masque, mot à mot */
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:.14em 0 .1em;margin:-.14em 0 -.1em}
.m>span{display:inline-block;transform:translate3d(0,112%,0) rotate(4deg);transform-origin:0 100%;transition:transform 1.5s cubic-bezier(.19,1,.22,1)}
.in .m>span{transform:none}
.m:nth-child(2)>span{transition-delay:.09s}.m:nth-child(3)>span{transition-delay:.18s}.m:nth-child(4)>span{transition-delay:.27s}

/* surtitres : filet rouge qui se dessine + lettres qui se resserrent */
.eb{opacity:0;letter-spacing:.42em !important;transition:opacity 1.1s ease,letter-spacing 1.6s cubic-bezier(.19,1,.22,1)}
.eb::before{content:"";display:inline-block;width:0;height:1px;margin-right:0;background:#E4032E;vertical-align:middle;transition:width 1.2s cubic-bezier(.19,1,.22,1) .2s,margin-right 1.2s cubic-bezier(.19,1,.22,1) .2s}
.in .eb{opacity:1;letter-spacing:.24em !important}
.in .eb::before{width:30px;margin-right:14px}

/* blocs et cartes : montée en cascade */
.rise{opacity:0;translate:0 56px;transition:opacity 1.2s cubic-bezier(.19,1,.22,1) var(--d,0s),translate 1.6s cubic-bezier(.19,1,.22,1) var(--d,0s)}
.in .rise{opacity:1;translate:0 0}
.rc.rise{transition:opacity 1.2s cubic-bezier(.19,1,.22,1) var(--d,0s),translate 1.6s cubic-bezier(.19,1,.22,1) var(--d,0s),transform .6s cubic-bezier(.16,.84,.12,1),box-shadow .6s cubic-bezier(.16,.84,.12,1),background .4s}

/* images : dévoilement + zoom 1.18 → 1 + parallaxe */
.unv{clip-path:inset(14% 9% 14% 9% round 22px);transition:clip-path 1.8s cubic-bezier(.19,1,.22,1) var(--d,0s)}
.in .unv{clip-path:inset(0 0 0 0 round 22px)}
.rm .zm{scale:1.18;transition:scale 2.4s cubic-bezier(.19,1,.22,1) var(--d,0s),transform 1.4s cubic-bezier(.16,.84,.12,1),opacity 1.1s ease}
.rm .in .zm{scale:1}
@keyframes plx{from{translate:0 -6%}to{translate:0 6%}}
@supports (animation-timeline: view()){
.plx{animation:plx linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
}
/* héros : profondeur au scroll */
.hpx{position:absolute;inset:0;translate:0 var(--rm-hy,0px);will-change:translate}
.hct{opacity:var(--rm-ho,1);translate:0 var(--rm-hc,0px)}


/* ===== univers (option D) : 4 photos bord à bord, extensibles ===== */
.uvs{position:relative;height:calc(100vh - 84px);min-height:620px;max-height:1040px;background:#141218;overflow:hidden;color:#fff}
.uvrow{position:absolute;inset:0;display:flex}
.ux{position:relative;flex:1 1 0;min-width:0;margin:0;padding:0;border:0;background:#141218;color:#fff;font-family:inherit;text-align:left;cursor:pointer;overflow:hidden;transition:flex-grow 1.15s cubic-bezier(.65,0,.12,1)}
.ux+.ux{box-shadow:inset 1px 0 0 rgba(255,255,255,.08)}
.uxp{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;scale:1.16;transform:scale(1.04);transition:scale 2.4s cubic-bezier(.19,1,.22,1) var(--d,0s),transform 1.6s cubic-bezier(.16,.84,.12,1),filter .9s ease}
.in .uxp{scale:1}
/* duotone doux : photo désaturée, teintée de la couleur de l'univers */
.uxp{filter:grayscale(.4) contrast(1.02)}
.uxt0{position:absolute;inset:0;background:var(--c);mix-blend-mode:color;opacity:.32;transition:opacity 1.1s ease}
.ux.on .uxp{filter:grayscale(.2)}
.ux.on .uxt0{opacity:.2}

/* ===== podcasts ===== */
.pzt{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:999px;background:rgba(20,18,24,.05)}
.pztb{height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:#141218;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .4s,color .4s,box-shadow .4s}
.pztb:hover{background:rgba(255,255,255,.7)}
.pztb.on{background:#141218;color:#fff;box-shadow:0 10px 24px -14px rgba(20,18,24,.7)}
.pzg{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:48px;align-items:stretch}
.pzf{position:relative;display:block;width:100%;aspect-ratio:1 / 1;max-height:640px;padding:0;border:0;border-radius:28px;overflow:hidden;background:#141218;color:#fff;text-align:left;font:inherit;cursor:pointer}
.pzfw{position:absolute;inset:0}
.pzfi{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.6s cubic-bezier(.16,.84,.12,1)}
.pzf:hover .pzfi{transform:scale(1.04)}
.pzfs{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,16,.35) 0%,rgba(10,10,16,0) 30%,rgba(10,10,16,.1) 50%,rgba(10,10,16,.88) 100%)}
.pzftop{position:absolute;left:28px;top:26px}
.pzchip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:999px;background:rgba(20,18,24,.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.pzfb{position:absolute;left:32px;right:32px;bottom:34px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.pzfsh{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.9)}
.pzfsh::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--c)}
.pzftt{font-size:clamp(26px,2.6vw,40px);line-height:1.08;font-weight:500;letter-spacing:-.025em;max-width:22ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pzfm{font-size:15px;color:rgba(255,255,255,.75)}
.pzfp{margin-top:8px;display:inline-flex;align-items:center;gap:12px;height:52px;padding:0 24px 0 6px;border-radius:999px;background:#fff;color:#141218;font-size:15px;font-weight:600;transition:transform .5s cubic-bezier(.16,.84,.12,1),box-shadow .5s}
.pzf:hover .pzfp{transform:translateY(-2px);box-shadow:0 18px 36px -16px rgba(0,0,0,.6)}
.pzfpi{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.pzfbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.12)}
.pzfbar i,.pzrbar i{display:block;height:100%;background:var(--c);transition:width .5s linear}
.pzl{display:flex;flex-direction:column;min-width:0}
.pzlh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid rgba(20,18,24,.12)}
.pzlt{font-size:22px;font-weight:500;letter-spacing:-.01em}
.pzls{font-size:13px;color:#6A6570;white-space:nowrap}
.pzr{position:relative;display:flex;align-items:center;gap:18px;width:100%;padding:14px 12px 14px 0;border:0;border-bottom:1px solid rgba(20,18,24,.08);background:transparent;color:#141218;text-align:left;font:inherit;cursor:pointer;transition:padding .55s cubic-bezier(.16,.84,.12,1),background .4s}
.pzr:hover{padding-left:10px;background:rgba(255,255,255,.55)}
.pzr.on{padding-left:10px;background:#fff}
.pzrc{position:relative;flex:0 0 auto;width:72px;height:72px;border-radius:14px;overflow:hidden;background:#E4032E;box-shadow:0 12px 24px -16px rgba(20,18,24,.6)}
.pzrc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s cubic-bezier(.16,.84,.12,1)}
.pzr:hover .pzrc img{transform:scale(1.08)}
.pzrp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,18,24,.38);color:#fff;opacity:0;transition:opacity .35s}
.pzr:hover .pzrp,.pzr.on .pzrp{opacity:1}
.pzrx{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.pzrs{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--c)}
.pzrt{font-size:16px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pzrm{font-size:13px;color:#6A6570}
.pzrbar{position:absolute;left:0;right:0;bottom:-1px;height:2px;opacity:0;transition:opacity .4s}
.pzr.on .pzrbar{opacity:1}
.pzc{flex:0 0 232px;scroll-snap-align:start;display:flex;flex-direction:column;gap:14px;padding:0;border:0;background:transparent;color:#141218;text-align:left;font:inherit;cursor:pointer;transition:opacity 1.2s cubic-bezier(.19,1,.22,1) var(--d,0s),translate 1.6s cubic-bezier(.19,1,.22,1) var(--d,0s)}
.pzci{position:relative;display:block;aspect-ratio:1 / 1;border-radius:22px;overflow:hidden;background:#E4032E;box-shadow:0 0 0 0 var(--c);transition:box-shadow .5s cubic-bezier(.16,.84,.12,1)}
.pzci img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pzc.on .pzci{box-shadow:0 0 0 3px var(--c),0 24px 44px -24px var(--c)}
.pzcn{position:absolute;left:12px;bottom:12px;height:26px;padding:0 11px;border-radius:999px;display:inline-flex;align-items:center;background:rgba(255,255,255,.92);font-size:12px;font-weight:600}
.pzcx{display:flex;flex-direction:column;gap:3px}
.pzcf{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.pzct{font-size:19px;font-weight:600;letter-spacing:-.01em}
.pzcs{font-size:14px;color:#6A6570}
.pzcl{margin-top:4px;font-size:12.5px;color:#6A6570}
.dprog{position:absolute;left:28px;right:28px;bottom:3px;height:2px;border-radius:2px;background:rgba(20,18,24,.08);overflow:hidden;transition:opacity .4s}
.dprog i{display:block;height:100%;background:var(--c);transition:width .5s linear}
@media (max-width: 1000px){.pzg{grid-template-columns:1fr}.pzf{max-height:none;aspect-ratio:4 / 5}}

/* fréquences / modes de diffusion */
.uxf{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;margin-top:-4px;min-height:90px;max-height:160px;overflow:hidden;transition:opacity .45s ease,min-height .9s cubic-bezier(.65,0,.12,1),max-height .9s cubic-bezier(.65,0,.12,1),margin .9s cubic-bezier(.65,0,.12,1)}
.bd{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:400;letter-spacing:.02em;white-space:nowrap;color:rgba(255,255,255,.86);background:rgba(20,18,24,.32);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.bd b{font-weight:600;color:#fff}
/* liseré de la couleur de l'univers en pied de bannière */
.uxbar{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--c);z-index:2;transition:height .9s cubic-bezier(.65,0,.12,1)}
.ux.on .uxbar{height:10px}
.uxs{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,16,.35) 0%,rgba(10,10,16,0) 38%,rgba(10,10,16,.1) 55%,rgba(10,10,16,.9) 100%);transition:opacity .9s ease}
.uxw{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,var(--w) 100%);mix-blend-mode:multiply;opacity:0;transition:opacity .9s ease}
.ux.on .uxw{opacity:.75}
.uxb{position:absolute;left:clamp(20px,2.2vw,32px);right:clamp(20px,2.2vw,32px);bottom:104px;display:flex;flex-direction:column;gap:16px}
.uxh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.uxl{width:min(128px,calc(100% - 60px));height:auto;aspect-ratio:392 / 141;object-fit:contain;flex:0 1 auto;min-width:0;display:block;filter:drop-shadow(0 2px 12px rgba(0,0,0,.35));transform-origin:left bottom;transition:transform 1s cubic-bezier(.65,0,.12,1)}
.uxpl{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;transition:transform .6s cubic-bezier(.16,.84,.12,1),background .4s,color .4s}
.ux.on .uxpl{background:var(--c);color:#fff}
.uxr{height:1px;background:rgba(255,255,255,.25)}
.uxlv{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.88)}
.uxi{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(14px);transition:grid-template-rows .9s cubic-bezier(.65,0,.12,1),opacity .45s ease,transform .9s cubic-bezier(.16,.84,.12,1)}
.uxi>span{min-height:0;overflow:hidden}
.uxn{display:flex;align-items:center;gap:18px;padding-top:2px}
.uxc{position:relative;flex:0 0 auto;width:96px;height:96px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 18px 40px -16px rgba(0,0,0,.6)}
.uxc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.uxt{min-width:0;display:flex;flex-direction:column;gap:6px;line-height:1.2}
.uxt1{font-size:24px;font-weight:600;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.uxt2{font-size:15px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ux.on .uxi{grid-template-rows:1fr;opacity:1;transform:none}
.ux.on .uxc{width:64px;height:64px}.ux.on .uxt1{font-size:18px}
.uvtop{position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(10,10,16,.6),rgba(10,10,16,0));pointer-events:none}
.uvtitle{position:absolute;left:clamp(24px,4vw,56px);right:clamp(24px,4vw,56px);top:clamp(36px,6vh,64px);pointer-events:none}
.uvtitle h2{margin:0;font-size:clamp(56px,7.6vw,120px);line-height:.92;letter-spacing:-0.04em;font-weight:300;color:#fff}
.uveb{color:rgba(255,255,255,.82)}
@media (hover:hover) and (min-width:901px){
.uvrow:hover .ux{flex-grow:.78}
.uvrow .ux:hover{flex-grow:2.4}
.ux:hover .uxp{transform:scale(1)}
.ux:hover .uxs{opacity:.72}
.uvrow:hover .ux:not(:hover) .uxp{filter:grayscale(.8) contrast(1.04) brightness(.62)}
.ux:hover .uxp{filter:none}
.ux:hover .uxt0{opacity:.08}
.ux:hover .uxbar{height:10px}
.uvrow:hover .ux:not(:hover) .uxf{opacity:0;min-height:0;max-height:0;margin-top:-16px}
.uvrow:hover .ux.on:not(:hover) .uxbar{height:6px}
.ux:hover .uxw{opacity:.55}
.ux:hover .uxpl{transform:scale(1.12);background:#fff;color:#141218}
.ux.on:hover .uxpl{background:var(--c);color:#fff}
.ux:hover .uxl{transform:scale(1.25)}
.ux:hover .uxi{grid-template-rows:1fr;opacity:1;transform:none;transition-delay:.2s,.35s,.2s}
.ux:hover .uxc{width:96px;height:96px}.ux:hover .uxt1{font-size:24px}
.uvrow:hover .ux.on:not(:hover) .uxi{grid-template-rows:0fr;opacity:0;transform:translateY(14px)}
}
.uxc,.uxt1{transition:width .9s cubic-bezier(.65,0,.12,1),height .9s cubic-bezier(.65,0,.12,1),font-size .9s cubic-bezier(.65,0,.12,1)}
@media (hover:none){.uxi{grid-template-rows:1fr;opacity:1;transform:none}.uxc{width:64px !important;height:64px !important}.uxt1{font-size:18px !important}}
@media (max-width:900px){
.uvs{height:auto;min-height:0;max-height:none;background:#F6F3EE;color:#141218;padding-top:100px;overflow:visible;display:flex;flex-direction:column}
.uvtitle{order:-1}
.uvtop{display:none}
.uvtitle{position:static;padding:0 24px 28px;pointer-events:auto}
.uvtitle h2{color:#141218;font-size:clamp(40px,11vw,64px)}
.uveb{color:#6A6570}
.uvrow{position:static;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.uvrow::-webkit-scrollbar{display:none}
.ux{flex:0 0 82vw;height:min(72vh,620px);scroll-snap-align:start}
.uxi{grid-template-rows:1fr;opacity:1;transform:none}
.uxc{width:64px !important;height:64px !important}.uxt1{font-size:18px !important}
}

.motion-off *,.motion-off *::before,.motion-off *::after{animation:none !important;transition:none !important}
@media (prefers-reduced-motion: reduce){.rm *,.rm *::before,.rm *::after{animation:none !important;transition:none !important}}
@media (max-width: 1000px){.nav{display:none !important}}
@media (max-width: 640px){.hide-sm{display:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="rm {{motionClass}}" style="min-height: 100vh; display: flex; flex-direction: column; background: #F6F3EE; color: #141218; font-family: 'Barlow', 'Helvetica Neue', Helvetica, sans-serif; overflow-x: clip; padding-bottom: 96px; --eq: {{eqState}}">

<!-- HEADER -->
<header class="hdr" style="position: sticky; top: 0; z-index: 60; height: 84px; margin-bottom: -84px; color: {{hdr.fg}}; background: {{hdr.bg}}; border-bottom: 1px solid {{hdr.line}}; backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4)">
<div style="max-width: 1400px; height: 100%; margin: 0 auto; padding: 0 clamp(24px,4vw,56px); display: flex; align-items: center; justify-content: space-between; gap: 32px">
<a href="#top" aria-label="Radio Monaco — accueil" style="display: flex; align-items: center; flex-shrink: 0">
<sc-if value="{{hdr.light}}" hint-placeholder-val="{{ true }}"><img src="assets/rm-logo-white.png" alt="Radio Monaco" style="height: 36px; width: auto; display: block; filter: drop-shadow(0 2px 14px rgba(0,0,0,.45))"></sc-if>
<sc-if value="{{hdr.dark}}" hint-placeholder-val="{{ false }}"><img src="assets/rm-logo-ink.png" alt="Radio Monaco" style="height: 36px; width: auto; display: block"></sc-if>
</a>
<nav class="nav" aria-label="Navigation principale" style="display: flex; align-items: center; gap: 34px; font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase">
<a href="#radios" class="{{nav.radios}}" aria-current="{{nav.radiosCur}}" ref="{{navRef.radios}}">Radios</a>
<a href="#podcasts" class="{{nav.podcasts}}" aria-current="{{nav.podcastsCur}}" ref="{{navRef.podcasts}}">Podcasts</a>
<a href="#actualites" class="{{nav.actualites}}" aria-current="{{nav.actualitesCur}}" ref="{{navRef.actualites}}">Actualités</a>
<a href="#reseaux" class="{{nav.reseaux}}" aria-current="{{nav.reseauxCur}}" ref="{{navRef.reseaux}}">Réseaux</a>
<a href="#equipes" class="{{nav.equipes}}" aria-current="{{nav.equipesCur}}" ref="{{navRef.equipes}}">Équipes</a>
<a href="#djs" class="{{nav.djs}}" aria-current="{{nav.djsCur}}" ref="{{navRef.djs}}">DJs</a>
<span class="ind" aria-hidden="true" style="width: {{ind.w}}px; transform: translateX({{ind.x}}px); opacity: {{ind.o}}"></span>
</nav>
<button class="btn" onClick="{{togglePlay}}" style="display: inline-flex; align-items: center; gap: 11px; height: 44px; padding: 0 20px 0 17px; border: 0; border-radius: 999px; background: {{hdr.btnBg}}; color: {{hdr.btnFg}}; font-size: 14px; font-weight: 500; cursor: pointer">
<span class="live-dot"></span><span>{{headerLabel}}</span>
</button>
</div>
<span class="prog" aria-hidden="true" style="opacity: {{hdr.prog}}"></span>
</header>

<!-- HERO SLIDESHOW -->
<section id="top" ref="{{secRef.top}}" style="position: relative; height: 900px; overflow: hidden; color: #FFFFFF; background: #1E2129">
<div class="hpx">
<img class="hs {{hero.k0}}" src="assets/rm-monaco-port.jpg" alt="Le port Hercule et Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; opacity: {{hero.o0}}">
<img class="hs {{hero.k1}}" src="assets/rm-monaco-baie.jpg" alt="La baie de Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%; opacity: {{hero.o1}}">
<img class="hs {{hero.k2}}" src="assets/rm-night.jpg" alt="Monaco de nuit" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; opacity: {{hero.o2}}">
<img class="hs {{hero.k3}}" src="assets/rm-casino.jpg" alt="Le Casino de Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; opacity: {{hero.o3}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,14,22,.52) 0%, rgba(12,14,22,.26) 35%, rgba(12,14,22,.28) 62%, rgba(12,14,22,.62) 100%)"></div>
<!-- logo focus: soft shadow halo behind the logo -->
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse 44% 34% at 50% 44%, rgba(8,10,18,.48) 0%, rgba(8,10,18,.2) 52%, rgba(8,10,18,0) 100%)"></div>
</div>

<div class="hct" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px 120px">
<div class="vid" style="width: min(880px, 100%); aspect-ratio: 16 / 9; margin: -20px 0 -112px">
<video ref="{{videoRef}}" autoplay muted playsinline preload="auto" aria-label="Logo Radio Monaco animé" style="width: 100%; height: 100%; display: block; mix-blend-mode: screen">
<source src="assets/rm-intro.webm" type="video/webm">
<source src="assets/rm-intro.mp4" type="video/mp4">
</video>
</div>
<p class="fade f1" style="margin: 0; padding-left: .44em; font-size: clamp(13px, 1.25vw, 17px); font-weight: 500; letter-spacing: .44em; text-transform: uppercase">The sound of Monte-Carlo</p>
<button class="btn fade f2" onClick="{{togglePlay}}" style="margin-top: 44px; display: inline-flex; align-items: center; gap: 14px; height: 56px; padding: 0 28px 0 8px; border: 0; border-radius: 999px; background: #FFFFFF; color: #141218; font-size: 15px; font-weight: 600; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 50%; background: #E4032E; color: #fff; display: inline-flex; align-items: center; justify-content: center">
<sc-if value="{{notPlaying}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></sc-if>
<sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"></path></svg></sc-if>
</span>
<span>{{heroLabel}}</span>
</button>
</div>

<!-- slide caption + progress -->
<div class="fade f3" style="position: absolute; left: 0; right: 0; bottom: 36px">
<div style="max-width: 1400px; margin: 0 auto; padding: 0 clamp(24px,4vw,56px); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 40px">
<div style="position: relative; height: 44px; min-width: 260px; flex: 1 1 260px">
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o0}}; transform: translateY({{hero.t0}}px); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8">01 / 04</span><span style="font-size: 16px; font-weight: 500">Le port Hercule</span></span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o1}}; transform: translateY({{hero.t1}}px); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8">02 / 04</span><span style="font-size: 16px; font-weight: 500">La baie de Monaco</span></span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o2}}; transform: translateY({{hero.t2}}px); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8">03 / 04</span><span style="font-size: 16px; font-weight: 500">Monaco, la nuit</span></span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o3}}; transform: translateY({{hero.t3}}px); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; letter-spacing: .24em; text-transform: uppercase; opacity: .8">04 / 04</span><span style="font-size: 16px; font-weight: 500">Le Casino de Monte-Carlo</span></span>
</div>
<div style="flex: 0 1 260px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button onClick="{{hero.go0}}" aria-label="Photo 1" style="height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar {{hero.b0}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go1}}" aria-label="Photo 2" style="height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar {{hero.b1}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go2}}" aria-label="Photo 3" style="height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar {{hero.b2}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go3}}" aria-label="Photo 4" style="height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar {{hero.b3}}" style="width: 100%"><i></i></span></button>
</div>
</div>
</div>
</section>

<!-- 01 · NOS UNIVERS (webradios) — 4 photos bord à bord, extensibles au survol -->
<section id="radios" data-full="1" ref="{{secRef.radios}}" class="uvs {{sec.radios}}">
<div class="uvrow">
<sc-for list="{{radios}}" as="r" hint-placeholder-count="4">
<button class="ux {{r.onCls}} {{r.inkCls}}" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" style="--c: {{r.color}}; --w: {{r.washC}}; --d: {{r.d}}">
<img class="uxp" src="{{r.photo}}" alt="" style="object-position: {{r.pos}}">
<span class="uxt0" aria-hidden="true"></span>
<span class="uxs" aria-hidden="true"></span>
<span class="uxw" aria-hidden="true"></span>
<span class="uxbar" aria-hidden="true"></span>
<span class="uxb rise">
<span class="uxh">
<img class="uxl" src="{{r.wlogo}}" alt="{{r.alt}}">
<span class="uxpl">
<sc-if value="{{r.eq}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"></path></svg></sc-if>
<sc-if value="{{r.play}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></sc-if>
</span>
</span>
<span class="uxr" aria-hidden="true"></span>
<span class="uxlv"><span class="live-dot" style="background: {{r.color}}"></span>{{r.status}}</span>
<span class="uxf" aria-label="{{r.bandsLabel}}">
<sc-for list="{{r.bands}}" as="b" hint-placeholder-count="2"><span class="bd">{{b.city}}<b>{{b.f}}</b></span></sc-for>
</span>
<span class="uxi"><span>
<span class="uxn">
<span class="uxc">
<sc-if value="{{r.hasCover}}" hint-placeholder-val="{{ false }}"><img src="{{r.cover}}" alt="Pochette du titre en cours"></sc-if>
<sc-if value="{{r.noCover}}" hint-placeholder-val="{{ true }}"><span class="eq" aria-hidden="true" style="--eq: {{r.eqRun}}"><i></i><i></i><i></i><i></i></span></sc-if>
</span>
<span class="uxt"><span class="uxt1">{{r.np1}}</span><span class="uxt2">{{r.np2}}</span></span>
</span>
</span></span>
</span>
</button>
</sc-for>
</div>
<div class="uvtop" aria-hidden="true"></div>
<div class="uvtitle">
<p class="eb uveb" style="margin: 0 0 18px; font-size: 12px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase">01 — Nos webradios</p>
<h2><span class="m"><span>Découvrez</span></span> <span class="m"><span style="font-weight: 600">nos univers.</span></span></h2>
</div>
</section>

<!-- 02 · PODCASTS (Ausha) -->
<section id="podcasts" ref="{{secRef.podcasts}}" class="{{sec.podcasts}}" style="padding: 140px 0 0">
<div style="max-width: 1400px; margin: 0 auto; padding: 0 clamp(24px,4vw,56px)">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px 40px; margin-bottom: 44px">
<div>
<p class="eb" style="margin: 0 0 18px; font-size: 12px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: #6A6570">02 — Podcasts</p>
<h2 style="margin: 0; font-size: clamp(40px, 4.8vw, 68px); line-height: 1; letter-spacing: -0.03em; font-weight: 300"><span class="m"><span>Vos rendez-vous préférés,</span></span> <span class="m"><span style="font-weight: 600">à la demande.</span></span></h2>
</div>
<div class="pzt rise" role="tablist" aria-label="Filtrer les podcasts" style="--d: .3s">
<sc-for list="{{podTabs}}" as="t" hint-placeholder-count="4"><button role="tab" class="pztb {{t.cls}}" aria-selected="{{t.sel}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
</div>
</div>

<div class="pzg">
<button class="pzf unv" onClick="{{feat.play}}" aria-label="{{feat.aria}}" style="--c: {{feat.color}}; --d: .1s">
<span class="pzfw zm"><img class="pzfi" src="{{feat.img}}" alt=""></span>
<span class="pzfs" aria-hidden="true"></span>
<span class="pzftop"><span class="pzchip"><span class="live-dot" style="background: {{feat.color}}"></span>{{feat.badge}}</span></span>
<span class="pzfb">
<span class="pzfsh">{{feat.show}}</span>
<span class="pzftt">{{feat.title}}</span>
<span class="pzfm">{{feat.meta}}</span>
<span class="pzfp"><span class="pzfpi">
<sc-if value="{{feat.on}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"></path></svg></sc-if>
<sc-if value="{{feat.off}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></sc-if>
</span>{{feat.cta}}</span>
</span>
<span class="pzfbar" aria-hidden="true"><i style="width: {{feat.pct}}%"></i></span>
</button>

<div class="pzl rise" style="--d: .25s">
<div class="pzlh"><span class="pzlt">{{podList.title}}</span><span class="pzls">{{podList.sub}}</span></div>
<sc-for list="{{podList.eps}}" as="e" hint-placeholder-count="6">
<button class="pzr {{e.cls}}" onClick="{{e.play}}" aria-label="{{e.aria}}" style="--c: {{e.color}}">
<span class="pzrc"><img src="{{e.img}}" alt="" loading="lazy"><span class="pzrp">
<sc-if value="{{e.on}}" hint-placeholder-val="{{ false }}"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></sc-if>
<sc-if value="{{e.off}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></sc-if>
</span></span>
<span class="pzrx"><span class="pzrs">{{e.show}}</span><span class="pzrt">{{e.title}}</span><span class="pzrm">{{e.meta}}</span></span>
<span class="pzrbar" aria-hidden="true"><i style="width: {{e.pct}}%"></i></span>
</button>
</sc-for>
</div>
</div>

<div style="margin-top: 72px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; margin-bottom: 24px">
<div><p style="margin: 0; font-size: 26px; font-weight: 500; letter-spacing: -0.015em">Toutes nos émissions</p><p style="margin: 6px 0 0; font-size: 15px; color: #6A6570">{{podShowsLabel}}</p></div>
<div style="display: flex; align-items: center; gap: 10px">
<button class="nb" onClick="{{pods.prev}}" aria-label="Émissions précédentes" style="width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(20,18,24,.2); background: transparent; color: #141218; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<button class="nb" onClick="{{pods.next}}" aria-label="Émissions suivantes" style="width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(20,18,24,.2); background: transparent; color: #141218; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
<div class="scroller" ref="{{pods.ref}}" onMouseEnter="{{pods.hold}}" onMouseLeave="{{pods.free}}" style="display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px max(clamp(24px,4vw,56px), calc((100% - 1400px) / 2 + 56px)) 12px; scroll-padding-left: max(clamp(24px,4vw,56px), calc((100% - 1400px) / 2 + 56px))">
<sc-for list="{{podShows}}" as="p" hint-placeholder-count="8">
<button data-card="1" class="pzc tile rise {{p.cls}}" onClick="{{p.pick}}" aria-pressed="{{p.sel}}" aria-label="{{p.aria}}" style="--d: {{p.d}}; --c: {{p.color}}">
<span class="pzci"><img class="ph zm" src="{{p.cover}}" alt="" loading="lazy"><span class="pzcn">{{p.count}}</span></span>
<span class="pzcx"><span class="pzcf">{{p.feedLabel}}</span><span class="pzct">{{p.name}}</span><span class="pzcs">{{p.sub}}</span><span class="pzcl">{{p.last}}</span></span>
</button>
</sc-for>
</div>
</section>

<!-- 02 · ACTUALITÉS (slider) -->
<section id="actualites" ref="{{secRef.actualites}}" class="{{sec.actualites}}" style="padding: 140px 0 0">
<div style="max-width: 1400px; margin: 0 auto; padding: 0 clamp(24px,4vw,56px)">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px 40px; margin-bottom: 44px">
<div>
<p class="eb" style="margin: 0 0 18px; font-size: 12px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: #6A6570">03 — Actualités</p>
<h2 style="margin: 0; font-size: clamp(40px, 4.8vw, 68px); line-height: 1; letter-spacing: -0.03em; font-weight: 300"><span class="m"><span>À la</span></span> <span class="m"><span style="font-weight: 600">une.</span></span></h2>
</div>
<div class="rise" style="display: flex; align-items: center; gap: 10px; --d: .35s">
<button class="nb" onClick="{{news.prev}}" aria-label="Actualité précédente" style="width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(20,18,24,.2); background: transparent; color: #141218; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<button class="nb" onClick="{{news.next}}" aria-label="Actualité suivante" style="width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(20,18,24,.2); background: transparent; color: #141218; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr)); gap: 32px 64px; align-items: center">
<a href="#" class="tile unv" style="position: relative; display: block; aspect-ratio: 16 / 11; border-radius: 22px; overflow: hidden; background: #D8CBB4; --d: .15s">
<div class="plx zm" style="position: absolute; inset: -8% 0">
<img class="slide ph" src="assets/rm-casino.jpg" alt="L’Opéra Garnier de Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; opacity: {{news.o0}}">
<img class="slide ph" src="assets/rm-monaco-port.jpg" alt="Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{news.o1}}">
<img class="slide ph" src="assets/rm-monaco-baie.jpg" alt="Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 60%; opacity: {{news.o2}}">
</div>
</a>

      ? { light: false, dark: true, fg: '#141218', bg: 'rgba(246,243,238,.88)', line: 'rgba(20,18,24,.08)', btnBg: '#141218', btnFg: '#FFFFFF' }
      : { light: true, dark: false, fg: '#FFFFFF', bg: 'rgba(246,243,238,0)', line: 'rgba(255,255,255,0)', btnBg: '#FFFFFF', btnFg: '#141218' };

    return {
      motionClass: motion ? '' : 'motion-off',
      hdr: Object.assign({ prog: scrolled ? 1 : 0 }, hdr), now, hero, news, headlines, team, teamThumbs, radios, pl,
      reelList: stg(reelList, 0.2), djs: stg(djs, 0.2), podList, podShows, podTabs, podShowsLabel, feat,
      sec, nav, navRef, secRef, ind,
      reels: this.slider('reels'), djsS: this.slider('djs'), pods: this.slider('pods'),
      playing, notPlaying: !playing,
      eqState: playing ? 'running' : 'paused',
      togglePlay: () => (podMode ? this.playEpisode(...(st.ep || ':').split(':').map((v, n) => (n ? +v : v))) : this.playStation(station, !playing)),
      playLabel: playing ? 'Mettre en pause' : (podMode ? 'Reprendre le podcast' : 'Écouter le direct'),
      headerLabel: playing ? 'En écoute' : 'Écouter',
      heroLabel: playing ? 'Pause' : 'Écouter le direct',
      videoRef: (el) => { if (el && !el._rmInit) { el._rmInit = true; el.muted = true; el.playsInline = true; const p = el.play && el.play(); if (p && p.catch) p.catch(() => {}); } }
    };
  }
}

DCRender(Component, document.getElementById('tpl'), document.getElementById('app'), { motion: true });
</script>
