<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Monaco — The sound of Monte-Carlo</title>
<meta name="description" content="Radio Monaco : le direct de Monte-Carlo, Paris, 100 % Mix DJ et Night Mood. 98.2 FM Monaco, DAB+, appli et SiriusXM.">
<meta name="theme-color" content="#F6F3EE">
<style>
@font-face{font-family:'Barlow';src:url(assets/Barlow-Light.ttf) format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-Regular.ttf) format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-Medium.ttf) format('truetype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Barlow';src:url(assets/Barlow-SemiBold.ttf) format('truetype');font-weight:600;font-style:normal;font-display:swap}
body{margin:0;background:#FAF8F5}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.rm *,.rm *::before,.rm *::after{box-sizing:border-box}
.rm button{font-family:inherit}
.rm :focus-visible{outline:1.5px solid #E4032E;outline-offset:3px}
.ic{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.lbl{margin:0 0 22px;font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:#6E6973}
.h2{margin:0;font-size:clamp(36px,4.2vw,60px);font-weight:300;letter-spacing:-.025em;line-height:1.02}

/* header */
.hdr{transition:background .6s ease,color .6s ease,border-color .6s ease}
.nav a{position:relative;opacity:.8;transition:opacity .3s}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .6s cubic-bezier(.16,.84,.12,1)}
.nav a:hover{opacity:1}
.nav a:hover::after{transform:scaleX(1);transform-origin:left}

/* links + buttons */
.ul{background-image:linear-gradient(currentColor,currentColor);background-size:100% 1px;background-position:0 100%;background-repeat:no-repeat;padding-bottom:3px;transition:background-size .6s cubic-bezier(.16,.84,.12,1)}
.ul:hover{background-size:0 1px;background-position:100% 100%}
.ghost{transition:background .4s,color .4s,border-color .4s}
.ghost:hover{background:#FFFFFF !important;color:#121116 !important;border-color:#FFFFFF !important}
.nb{transition:background .35s,color .35s,border-color .35s}
.nb:hover{background:#121116 !important;color:#FFFFFF !important;border-color:#121116 !important}
.more .arrow{transition:transform .5s cubic-bezier(.2,.8,.1,1)}
.more:hover .arrow{transform:translateX(5px)}

/* hero */
.hs{transition:opacity 2s ease}
@keyframes kenburns{from{transform:scale(1.12)}to{transform:scale(1.02)}}
.kb-on{animation:kenburns 8s cubic-bezier(.2,.6,.2,1) both}
.cap{transition:opacity 1s ease,transform 1s cubic-bezier(.16,.84,.12,1)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar{position:relative;display:block;height:1px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{position:absolute;inset:0;background:#FFFFFF;transform:scaleX(0);transform-origin:left}
.bar.on i{animation:fill 6s linear both}
.bar.dark{background:rgba(18,17,22,.15)}
.bar.dark i{background:#121116}
.bar.dark.on i{animation-duration:7s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fade{animation:fadeUp 1.4s cubic-bezier(.16,.84,.12,1) both}
.f1{animation-delay:3.3s}.f2{animation-delay:3.7s}.f3{animation-delay:4.1s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.vid{animation:fadeIn 1s ease .2s both}

/* equalizer + live */
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.eq{display:flex;align-items:flex-end;gap:2px;height:12px}
.eq i{display:block;width:2px;height:100%;background:currentColor;border-radius:1px;transform-origin:bottom;animation:eq 1s ease-in-out infinite;animation-play-state:var(--eq,running)}
.eq i:nth-child(2){animation-duration:.78s;animation-delay:-.3s}
.eq i:nth-child(3){animation-duration:1.15s;animation-delay:-.6s}
.eq i:nth-child(4){animation-duration:.9s;animation-delay:-.15s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(228,3,46,.45)}100%{box-shadow:0 0 0 8px rgba(228,3,46,0)}}
.dot{display:inline-block;flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:#E4032E;animation:pulse 2s ease-out infinite}

/* cards */
.radio{transition:border-color .4s,box-shadow .5s,transform .6s cubic-bezier(.16,.84,.12,1)}
.radio:hover{border-color:rgba(18,17,22,.35) !important;transform:translateY(-2px)}
.radio .pb{transition:background .35s,color .35s,border-color .35s}
.radio:hover .pb{border-color:#121116 !important}
.tile .ph{transition:transform 1.4s cubic-bezier(.16,.84,.12,1),filter .8s ease}
.tile:hover .ph{transform:scale(1.04)}
.mono .ph{filter:grayscale(1) contrast(1.04)}
.mono:hover .ph{filter:grayscale(0) contrast(1)}
.row .rt{transition:color .3s}
.row:hover .rt{color:#B4001F}
.name{transition:color .4s,padding .6s cubic-bezier(.16,.84,.12,1)}
.name:hover{color:#121116 !important}
.slide{transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.16,.84,.12,1)}
.scroller{scrollbar-width:none;scroll-behavior:smooth}
.scroller::-webkit-scrollbar{display:none}

@keyframes reveal{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@supports (animation-timeline: view()){
.reveal{animation:reveal linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
}
.motion-off *,.motion-off *::before,.motion-off *::after{animation:none !important;transition:none !important}
@media (prefers-reduced-motion: reduce){.rm *,.rm *::before,.rm *::after{animation:none !important;transition:none !important}}
@media (max-width: 1000px){.nav{display:none !important}}
@media (max-width: 640px){.hide-sm{display:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="rm {{motionClass}}" style="min-height: 100vh; display: flex; flex-direction: column; background: #FAF8F5; color: #121116; font-family: 'Barlow', 'Helvetica Neue', Helvetica, sans-serif; font-weight: 400; overflow-x: clip; padding-bottom: 96px; --eq: {{eqState}}">

<!-- HEADER -->
<header class="hdr" style="position: sticky; top: 0; z-index: 60; height: 80px; margin-bottom: -80px; color: {{hdr.fg}}; background: {{hdr.bg}}; border-bottom: 1px solid {{hdr.line}}; backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3)">
<div style="max-width: 1360px; height: 100%; margin: 0 auto; padding: 0 clamp(24px,4vw,48px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 32px">
<a href="#top" aria-label="Radio Monaco — accueil" style="display: flex; align-items: center; justify-self: start">
<sc-if value="{{hdr.light}}" hint-placeholder-val="{{ true }}"><img src="assets/rm-logo-white.png" alt="Radio Monaco" style="height: 30px; width: auto; display: block"></sc-if>
<sc-if value="{{hdr.dark}}" hint-placeholder-val="{{ false }}"><img src="assets/rm-logo-ink.png" alt="Radio Monaco" style="height: 30px; width: auto; display: block"></sc-if>
</a>
<nav class="nav" aria-label="Navigation principale" style="display: flex; align-items: center; gap: 36px; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase">
<a href="#radios">Radios</a>
<a href="#actualites">Actualités</a>
<a href="#reseaux">Réseaux</a>
<a href="#equipes">Équipes</a>
<a href="#djs">DJs</a>
<a href="#podcasts">Podcasts</a>
</nav>
<button onClick="{{togglePlay}}" style="justify-self: end; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0; border: 0; background: transparent; color: inherit; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; cursor: pointer">
<span class="dot"></span><span class="ul">{{headerLabel}}</span>
</button>
</div>
</header>

<!-- HERO -->
<section id="top" style="position: relative; height: 880px; overflow: hidden; color: #FFFFFF; background: #15161A">
<img class="hs {{hero.k0}}" src="assets/rm-monaco-port.jpg" alt="Le port Hercule et Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; filter: brightness(.7) saturate(.88); opacity: {{hero.o0}}">
<img class="hs {{hero.k1}}" src="assets/rm-night.jpg" alt="Monaco de nuit" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; filter: brightness(.74) saturate(.88); opacity: {{hero.o1}}">
<img class="hs {{hero.k2}}" src="assets/rm-monaco-baie.jpg" alt="La baie de Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%; filter: brightness(.68) saturate(.85); opacity: {{hero.o2}}">
<img class="hs {{hero.k3}}" src="assets/rm-casino.jpg" alt="Le Casino de Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; filter: brightness(.66) saturate(.85); opacity: {{hero.o3}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,14,.38) 0%, rgba(10,10,14,.08) 30%, rgba(10,10,14,.08) 70%, rgba(10,10,14,.5) 100%)"></div>

<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px 60px">
<div class="vid" style="width: min(600px, 84%); aspect-ratio: 16 / 9; margin: -10px 0 -78px">
<video ref="{{videoRef}}" autoplay muted playsinline preload="auto" aria-label="Logo Radio Monaco animé" style="width: 100%; height: 100%; display: block; mix-blend-mode: screen">
<source src="assets/rm-intro.webm" type="video/webm">
<source src="assets/rm-intro.mp4" type="video/mp4">
</video>
</div>
<p class="fade f1" style="margin: 0; padding-left: .5em; font-size: 12px; font-weight: 500; letter-spacing: .5em; text-transform: uppercase">The sound of Monte-Carlo</p>
<button class="ghost fade f2" onClick="{{togglePlay}}" style="margin-top: 48px; display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55); background: transparent; color: #FFFFFF; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; cursor: pointer">
<span class="dot"></span><span>{{heroLabel}}</span>
</button>
</div>

<div class="fade f3" style="position: absolute; left: 0; right: 0; bottom: 40px">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 clamp(24px,4vw,48px); display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
<div style="position: relative; height: 36px; flex: 1 1 auto">
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o0}}; transform: translateY({{hero.t0}}px); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap">01 — Le port Hercule</span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o1}}; transform: translateY({{hero.t1}}px); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap">02 — Monaco, la nuit</span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o2}}; transform: translateY({{hero.t2}}px); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap">03 — La baie de Monaco</span>
<span class="cap" style="position: absolute; left: 0; bottom: 0; opacity: {{hero.o3}}; transform: translateY({{hero.t3}}px); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; white-space: nowrap">04 — Le Casino de Monte-Carlo</span>
</div>
<div style="flex: 0 0 200px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button onClick="{{hero.go0}}" aria-label="Photo 1" style="height: 36px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-end"><span class="bar {{hero.b0}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go1}}" aria-label="Photo 2" style="height: 36px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-end"><span class="bar {{hero.b1}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go2}}" aria-label="Photo 3" style="height: 36px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-end"><span class="bar {{hero.b2}}" style="width: 100%"><i></i></span></button>
<button onClick="{{hero.go3}}" aria-label="Photo 4" style="height: 36px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-end"><span class="bar {{hero.b3}}" style="width: 100%"><i></i></span></button>
</div>
</div>
</div>
</section>

<!-- 01 · RADIOS -->
<section id="radios" style="padding: 96px 0 0">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 clamp(24px,4vw,48px)">
<div class="reveal" style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 28px">
<p class="lbl" style="margin: 0">01 · En direct</p>
<p class="lbl hide-sm" style="margin: 0">{{now.range}} · {{now.name}}</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 16px">
<sc-for list="{{radios}}" as="r" hint-placeholder-count="4">
<button class="radio reveal" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" style="display: flex; flex-direction: column; gap: 22px; padding: 24px 22px 20px; border-radius: 14px; border: 1px solid {{r.border}}; background: #FFFFFF; color: #121116; text-align: left; cursor: pointer">
<span style="width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<img src="{{r.logo}}" alt="{{r.alt}}" style="height: 42px; width: auto; max-width: 70%; display: block">
<span class="pb" style="flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 1px solid {{r.btnBorder}}; background: {{r.btnBg}}; color: {{r.btnFg}}; display: inline-flex; align-items: center; justify-content: center">
<sc-if value="{{r.eq}}" hint-placeholder-val="{{ false }}"><span class="eq"><i></i><i></i><i></i><i></i></span></sc-if>
<sc-if value="{{r.play}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"></path></svg></sc-if>
</span>
</span>
<span style="width: 100%; height: 1px; background: rgba(18,17,22,.08)"></span>
<span style="width: 100%; display: flex; align-items: center; gap: 14px; min-width: 0">
<span style="flex: 0 0 auto; position: relative; width: 52px; height: 52px; border-radius: 6px; overflow: hidden; background: #F2EFEA; display: inline-flex; align-items: center; justify-content: center; color: {{r.color}}">
<sc-if value="{{r.hasCover}}" hint-placeholder-val="{{ false }}"><img src="{{r.cover}}" alt="Pochette" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{r.noCover}}" hint-placeholder-val="{{ true }}"><span class="eq" aria-hidden="true" style="--eq: running"><i></i><i></i><i></i><i></i></span></sc-if>
</span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.np1}}</span>
<span style="font-size: 13px; color: #6E6973; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.np2}}</span>
</span>
</span>
</button>
</sc-for>
</div>
</div>
</section>

<!-- 02 · ACTUALITÉS -->
<section id="actualites" style="padding: 160px 0 0">
<div style="max-width: 1360px; margin: 0 auto; padding: 0 clamp(24px,4vw,48px)">
<div class="reveal" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px 40px; margin-bottom: 52px; padding-top: 28px; border-top: 1px solid rgba(18,17,22,.12)">
<div><p class="lbl">02 · Actualités</p><h2 class="h2">À la une</h2></div>
<a href="#" class="more" style="display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase"><span class="ul">Toutes les actualités</span><svg class="ic arrow" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>

<div class="reveal" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 40px 80px; align-items: center">
<a href="#" class="tile" style="position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #E9E4DC">
<img class="slide ph" src="assets/rm-casino.jpg" alt="L’Opéra Garnier de Monte-Carlo" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; opacity: {{news.o0}}">
<img class="slide ph" src="assets/rm-monaco-port.jpg" alt="Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: {{news.o1}}">
<img class="slide ph" src="assets/rm-monaco-baie.jpg" alt="Monaco" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 30% 60%; opacity: {{news.o2}}">
</a>
<div style="display: flex; flex-direction: column; gap: 40px">
<div style="position: relative; min-height: 230px">
<a href="#" class="slide more" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 20px; opacity: {{news.o0}}; transform: translateY({{news.t0}}px); pointer-events: {{news.p0}}">
<span class="lbl" style="margin: 0; color: #B4001F">Musique · 18 — 29 novembre</span>
<span style="font-size: clamp(28px, 2.6vw, 38px); font-weight: 300; letter-spacing: -0.02em; line-height: 1.15">Monte-Carlo Jazz Festival 2026 : vingt ans de passion à l’Opéra Garnier</span>
<span style="display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase">Lire<svg class="ic arrow" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
<a href="#" class="slide more" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 20px; opacity: {{news.o1}}; transform: translateY({{news.t1}}px); pointer-events: {{news.p1}}">
<span class="lbl" style="margin: 0; color: #B4001F">Monaco</span>
<span style="font-size: clamp(28px, 2.6vw, 38px); font-weight: 300; letter-spacing: -0.02em; line-height: 1.15">Budget rectificatif 2026 : le Conseil National dit oui après des avancées sur l’emploi et le logement</span>
<span style="display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase">Lire<svg class="ic arrow" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
<a href="#" class="slide more" style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 20px; opacity: {{news.o2}}; transform: translateY({{news.t2}}px); pointer-events: {{news.p2}}">
<span class="lbl" style="margin: 0; color: #B4001F">Monaco</span>
<span style="font-size: clamp(28px, 2.6vw, 38px); font-weight: 300; letter-spacing: -0.02em; line-height: 1.15">Planetary Health Awards 2026 : la Fondation Prince Albert II fête ses vingt ans</span>
<span style="display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase">Lire<svg class="ic arrow" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>
</div>
<div style="display: flex; align-items: center; gap: 24px">
<div style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 240px">
<button onClick="{{news.go0}}" aria-label="Actualité 1" style="height: 32px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar dark {{news.b0}}" style="width: 100%"><i></i></span></button>
<button onClick="{{news.go1}}" aria-label="Actualité 2" style="height: 32px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar dark {{news.b1}}" style="width: 100%"><i></i></span></button>
<button onClick="{{news.go2}}" aria-label="Actualité 3" style="height: 32px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center"><span class="bar dark {{news.b2}}" style="width: 100%"><i></i></span></button>
</div>
<div style="display: flex; gap: 8px">
<button class="nb" onClick="{{news.prev}}" aria-label="Actualité précédente" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(18,17,22,.18); background: transparent; color: #121116; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></button>
<button class="nb" onClick="{{news.next}}" aria-label="Actualité suivante" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(18,17,22,.18); background: transparent; color: #121116; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</div>

<div class="reveal" style="margin-top: 72px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 0 48px">
<sc-for list="{{headlines}}" as="n" hint-placeholder-count="3">
<a href="#" class="row" style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid rgba(18,17,22,.12)">
<span class="lbl" style="margin: 0">{{n.cat}}</span>
<span class="rt" style="font-size: 19px; font-weight: 400; letter-spacing: -0.005em; line-height: 1.35">{{n.title}}</span>
</a>
</sc-for>
</div>
</div>
</section>

<script>
/* Mini moteur de rendu (compatible avec la maquette Design) : {{ }}, <sc-if>, <sc-for>, événements, refs. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(u, cb) {
    const p = typeof u === 'function' ? u(this.state, this.props) : u;
    if (p) this.state = Object.assign({}, this.state, p);
    if (this.__schedule) this.__schedule();
    if (cb) cb();
  }
  forceUpdate() { if (this.__schedule) this.__schedule(); }
}
function DCRender(Comp, tpl, mount, props) {
  const inst = new Comp(props || {});
  if (!inst.state) inst.state = {};
  const root = { vars: {}, parent: null };
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const lit = (s) => {
    if (s === 'true') return true;
    if (s === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
    if (/^'.*'$/.test(s) || /^".*"$/.test(s)) return s.slice(1, -1);
    return undefined;
  };
  const resolve = (path, ctx) => {
    const l = lit(path);
    if (l !== undefined) return l;
    const segs = path.split('.');
    let c = ctx, base;
    while (c) {
      if (c.vars && Object.prototype.hasOwnProperty.call(c.vars, segs[0])) { base = c.vars[segs[0]]; break; }
      c = c.parent;
    }
    if (!c) return undefined;
    for (let i = 1; i < segs.length; i++) { if (base == null) return undefined; base = base[segs[i]]; }
    return base;
  };
  const interp = (str, ctx) => str.replace(HOLE, (_, p) => { const v = resolve(p, ctx); return v == null ? '' : String(v); });
  const whole = (str) => { const m = (str || '').match(/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/); return m ? m[1] : null; };
  const EV = { onclick: 'click', onmouseenter: 'mouseenter', onmouseleave: 'mouseleave', onchange: 'input', oninput: 'input', onfocus: 'focus', onblur: 'blur' };

  function compileChildren(parent, ctx, out) { Array.from(parent.childNodes).forEach((n) => compileNode(n, ctx, out)); }
  function compileNode(n, ctx, out) {
    if (n.nodeType === 3) {
      if (n.nodeValue.indexOf('{{') >= 0) {
        const t = n.nodeValue;
        const f = () => { const v = interp(t, ctx); if (n.nodeValue !== v) n.nodeValue = v; };
        f(); out.push(f);
      }
      return;
    }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    if (tag === 'sc-if' || tag === 'sc-for') { block(n, tag, ctx, out); return; }
    Array.from(n.attributes).forEach((a) => {
      const name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) { n.removeAttribute(name); return; }
      if (val.indexOf('{{') < 0) return;
      if (EV[name]) {
        const p = whole(val); n.removeAttribute(name);
        n.addEventListener(EV[name], (e) => { const fn = resolve(p, ctx); if (typeof fn === 'function') fn(e); });
        return;
      }
      if (name === 'ref') {
        const p = whole(val); n.removeAttribute(name);
        const f = () => { const fn = resolve(p, ctx); if (typeof fn === 'function') fn(n); };
        f(); out.push(f);
        return;
      }
      const f = () => { const v = interp(val, ctx); if (n.getAttribute(name) !== v) n.setAttribute(name, v); };
      f(); out.push(f);
    });
    compileChildren(n, ctx, out);
  }
  function block(n, tag, ctx, out) {
    const anchor = document.createComment(tag);
    n.parentNode.replaceChild(anchor, n);
    const frag = n.ownerDocument.createDocumentFragment();
    while (n.firstChild) frag.appendChild(n.firstChild);
    const remove = (nodes) => nodes.forEach((x) => x.parentNode && x.parentNode.removeChild(x));
    if (tag === 'sc-if') {
      const p = whole(n.getAttribute('value')) || 'false';
      let cur = null;
      const f = () => {
        const on = !!resolve(p, ctx);
        if (on && !cur) {
          const c = frag.cloneNode(true), b = [];
          compileChildren(c, ctx, b);
          cur = { nodes: Array.from(c.childNodes), b };
          anchor.parentNode.insertBefore(c, anchor);
        } else if (on && cur) { cur.b.forEach((x) => x()); }
        else if (!on && cur) { remove(cur.nodes); cur = null; }
      };
      f(); out.push(f);
    } else {
      const p = whole(n.getAttribute('list'));
      const as = n.getAttribute('as') || 'item';
      const items = [];
      const f = () => {
        const list = resolve(p, ctx) || [];
        for (let i = 0; i < list.length; i++) {
          if (items[i]) { items[i].ctx.vars[as] = list[i]; items[i].ctx.vars.$index = i; items[i].b.forEach((x) => x()); }
          else {
            const c2 = { vars: { [as]: list[i], $index: i }, parent: ctx };
            const c = frag.cloneNode(true), b = [];
            compileChildren(c, c2, b);
            items.push({ ctx: c2, b, nodes: Array.from(c.childNodes) });
            anchor.parentNode.insertBefore(c, anchor);
          }
        }
        while (items.length > list.length) remove(items.pop().nodes);
      };
      f(); out.push(f);
    }
  }

  const content = tpl.content.cloneNode(true);
  const binders = [];
  root.vars = inst.renderVals() || {};
  compileChildren(content, root, binders);
  mount.appendChild(content);
  let queued = false;
  inst.__schedule = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; root.vars = inst.renderVals() || {}; binders.forEach((f) => f()); });
  };
  if (inst.componentDidMount) inst.componentDidMount();
  return inst;
}


class Component extends DCLogic {
  streams() {
    return [
      { stream: 'https://radiomonaco.ice.infomaniak.ch/radiomonaco-128.mp3' },
      { stream: 'https://radiomonacoparis.ice.infomaniak.ch/radiomonacoparis-320.aac' },
      { stream: 'https://mixdj.ice.infomaniak.ch/mixdj-128.aac' },
      { stream: 'https://nightmood.ice.infomaniak.ch/nightmood-128.aac' }
    ];
  }
  nice(s) {
    s = (s || '').replace(/\s+/g, ' ').trim();
    const letters = s.replace(/[^A-Za-zÀ-ÿ]/g, '');
    const up = letters.replace(/[^A-ZÀ-Þ]/g, '').length;
    if (letters.length && up / letters.length > 0.6) s = s.toLowerCase().replace(/(^|[\s(\-&/])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
    return s;
  }
  async readMeta() {
    this._covers = this._covers || {};
    const meta = Object.assign({}, (this.state && this.state.meta) || {});
    await Promise.all(this.streams().map(async (s, i) => {
      try {
        const r = await fetch(s.stream + '.xspf?r=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return;
        const xml = new DOMParser().parseFromString(await r.text(), 'text/xml');
        const t = xml.querySelector('track > title');
        const raw = t ? t.textContent.trim() : '';
        if (!raw) { meta[i] = null; return; }
        const parts = raw.split(' - ');
        const artist = this.nice(parts.length > 1 ? parts[0] : '');
        const title = this.nice(parts.length > 1 ? parts.slice(1).join(' - ') : raw);
        let cover = this._covers[raw];
        if (cover === undefined && artist) {
          try {
            const q = encodeURIComponent((artist + ' ' + title).replace(/\(.*?\)|feat\.?.*$/gi, ' ').trim());
            const j = await (await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=1&term=' + q)).json();
            const a = j.results && j.results[0] && j.results[0].artworkUrl100;
            cover = a ? a.replace('100x100bb', '600x600bb') : null;
          } catch (e) { cover = null; }
          this._covers[raw] = cover;
        }
        meta[i] = { artist, title, cover: cover || null };
      } catch (e) {}
    }));
    this.setState({ meta });
  }
  audio() {
    if (!this._audio && typeof Audio !== 'undefined') { this._audio = new Audio(); this._audio.preload = 'none'; }
    return this._audio;
  }
  playStation(i, on) {
    const a = this.audio();
    if (a) {
      try {
        if (on) {
          const src = this.streams()[i].stream;
          if (a.src !== src) a.src = src;
          const p = a.play(); if (p && p.catch) p.catch(() => {});
        } else { a.pause(); }
      } catch (e) {}
    }
    this.setState({ station: i, playing: on });
  }
  componentDidMount() {
    this._sc = this._sc || {};
    this._hold = this._hold || {};
    this.readMeta();
    this._metaT = setInterval(() => this.readMeta(), 20000);
    this._t = setInterval(() => this.setState({ tick: Date.now() }), 30000);
    this._hero = setInterval(() => this.setState((s) => ({ hero: (((s && s.hero) || 0) + 1) % 4 })), 6000);
    this._news = setInterval(() => this.setState((s) => ({ news: (((s && s.news) || 0) + 1) % 3 })), 7000);
    this._team = setInterval(() => {
      if (this._teamHold && Date.now() - this._teamHold < 15000) return;
      this.setState((s) => ({ team: (((s && s.team) || 0) + 1) % 4 }));
    }, 5000);
    this._auto = setInterval(() => {
      ['reels', 'djs', 'pods'].forEach((k) => {
        const el = this._sc[k];
        if (!el || this._hold[k]) return;
        const max = el.scrollWidth - el.clientWidth;
        if (max <= 4) return;
        const card = el.querySelector('[data-card]');
        const step = (card ? card.offsetWidth : 260) + 16;
        if (el.scrollLeft >= max - 4) el.scrollTo({ left: 0, behavior: 'smooth' });
        else el.scrollBy({ left: step, behavior: 'smooth' });
      });
    }, 4200);
    this._onScroll = () => {
      const y = window.scrollY || (document.scrollingElement && document.scrollingElement.scrollTop) || 0;
      const s = y > 80;
      if (s !== !!(this.state && this.state.scrolled)) this.setState({ scrolled: s });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }
  componentWillUnmount() {
    [this._t, this._hero, this._news, this._team, this._auto, this._metaT].forEach((x) => x && clearInterval(x));
    if (this._audio) { try { this._audio.pause(); } catch (e) {} }
    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
  }
  slider(k) {
    this._sc = this._sc || {};
    this._hold = this._hold || {};
    const move = (dir) => () => {
      const el = this._sc[k]; if (!el) return;
      const card = el.querySelector('[data-card]');
      el.scrollBy({ left: dir * ((card ? card.offsetWidth : 260) + 16), behavior: 'smooth' });
    };
    return {
      ref: (el) => { this._sc[k] = el; },
      hold: () => { this._hold[k] = true; },
      free: () => { this._hold[k] = false; },
      prev: move(-1),
      next: move(1)
    };
  }
  renderVals() {
    const st = this.state || {};
    const playing = !!st.playing;
    const station = st.station ?? 0;
    const scrolled = !!st.scrolled;
    const heroI = st.hero ?? 0;
    const newsI = st.news ?? 0;
    const teamI = st.team ?? 0;
    const motion = this.props.motion ?? true;
    const pad = (n) => String(n).padStart(2, '0');

    let h = 8, m = 0;
    try {
      const parts = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Monaco', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
      const g = (t) => (parts.find((p) => p.type === t) || {}).value || '';
      h = parseInt(g('hour'), 10) % 24; m = parseInt(g('minute'), 10);
    } catch (e) {}
    if (isNaN(h)) h = 8;
    if (isNaN(m)) m = 0;
    const grid = [
      { s: 0, e: 5, name: '100 % Mix DJ' },
      { s: 5, e: 7, name: 'The Sound of Monte-Carlo' },
      { s: 7, e: 10, name: 'Le Morning « Made in Monte-Carlo »' },
      { s: 10, e: 12, name: 'Le Morning +' },
      { s: 12, e: 16, name: 'The Sound of Monte-Carlo' },
      { s: 16, e: 19, name: 'Music & News' },
      { s: 19, e: 20, name: 'DJ sets' },
      { s: 20, e: 24, name: 'Night Mood' }
    ];
    const nowH = h + m / 60;
    const c = grid.find((g) => nowH >= g.s && nowH < g.e) || grid[0];
    const now = { name: c.name, range: pad(c.s) + ':00 — ' + pad(c.e % 24) + ':00' };

    const hero = {};
    [0, 1, 2, 3].forEach((i) => {
      const on = i === heroI;
      hero['o' + i] = on ? 1 : 0;
      hero['k' + i] = on ? 'kb-on' : '';
      hero['b' + i] = on ? 'on' : '';
      hero['t' + i] = on ? 0 : 10;
      hero['go' + i] = () => this.setState({ hero: i });
    });

    const news = {
      prev: () => this.setState({ news: (newsI + 2) % 3 }),
      next: () => this.setState({ news: (newsI + 1) % 3 })
    };
    [0, 1, 2].forEach((i) => {
      const on = i === newsI;
      news['o' + i] = on ? 1 : 0;
      news['t' + i] = on ? 0 : 14;
      news['p' + i] = on ? 'auto' : 'none';
      news['b' + i] = on ? 'on' : '';
      news['go' + i] = () => this.setState({ news: i });
    });
    const headlines = [
      { cat: 'Sport', title: 'Grand Prix de Singapour : Charles Leclerc de retour sur le podium' },
      { cat: 'Côte d’Azur', title: 'La Croisette entame sa grande transformation, cap sur 2028' },
      { cat: 'Sport', title: 'Rolex Monte-Carlo Masters 2027 : la billetterie ouvre au grand public' }
    ];

    const team = {};
    [0, 1, 2, 3].forEach((i) => {
      const on = i === teamI;
      team['o' + i] = on ? 1 : 0;
      team['s' + i] = on ? 1 : 1.04;
    });
    const TT = [
      { label: 'Léo Barraband', role: 'Animateur' },
      { label: 'Giulia Testaverde', role: 'Animatrice' },
      { label: 'Marie Marquet', role: 'Journaliste' },
      { label: 'Le Morning', role: '07:00 — 10:00' }
    ];
    const teamList = TT.map((t, i) => ({
      ...t,
      pressed: i === teamI ? 'true' : 'false',
      fg: i === teamI ? '#121116' : '#A39EA6',
      line: i === teamI ? '100%' : '0%',
      tr: i === teamI ? 'width 5s linear' : 'none',
      pick: () => { this._teamHold = Date.now(); this.setState({ team: i }); }
    }));

    const R = [
      { name: 'Monte-Carlo', aria: 'Écouter Radio Monaco Monte-Carlo', alt: 'Radio Monaco Monte Carlo', logo: 'assets/wr-montecarlo-ink.png', color: '#E4032E', line: now.name },
      { name: 'Paris', aria: 'Écouter Radio Monaco Paris', alt: 'Radio Monaco Paris', logo: 'assets/wr-paris-ink.png', color: '#E4032E', line: 'La webradio Radio Monaco' },
      { name: '100 % Mix DJ', aria: 'Écouter Radio Monaco 100 % Mix DJ', alt: 'Radio Monaco 100 % Mix DJ', logo: 'assets/wr-mixdj-ink.png', color: '#F59C00', line: 'DJ sets non-stop' },
      { name: 'Night Mood', aria: 'Écouter Radio Monaco Night Mood', alt: 'Radio Monaco Night Mood', logo: 'assets/wr-nightmood-ink.png', color: '#8A5AA1', line: 'La playlist de Pampa' }
    ];
    const meta = st.meta || {};
    const np = (i) => {
      const mm = meta[i];
      if (mm && mm.title) return { np1: mm.title, np2: mm.artist || R[i].name, cover: mm.cover || '', hasCover: !!mm.cover, noCover: !mm.cover };
      return { np1: i === 0 ? now.name : R[i].line, np2: 'En direct', cover: '', hasCover: false, noCover: true };
    };
    const radios = R.map((r, i) => {
      const sel = station === i;
      const on = sel && playing;
      return {
        ...r,
        ...np(i),
        pressed: sel ? 'true' : 'false',
        eq: on,
        play: !on,
        border: sel ? '#121116' : 'rgba(18,17,22,.1)',
        btnBg: on ? '#121116' : 'transparent',
        btnFg: on ? '#FFFFFF' : '#121116',
        btnBorder: on ? '#121116' : 'rgba(18,17,22,.2)',
        pick: () => this.playStation(i, sel ? !playing : true)
      };
    });
    const s = R[station];
    const pl = Object.assign({ name: 'Radio Monaco · ' + s.name, accent: s.color }, np(station));

    const IG = 'https://www.instagram.com/radiomonaco_officiel/reel/';
    const reelList = [
      { href: IG + 'DeROTQ1t5k1/', img: 'assets/reel-clooney.jpg', alt: 'Reel : que va faire George Clooney dans ce petit village du Var ?' },
      { href: IG + 'DeOnlDnN5P7/', img: 'assets/reel-orientexpress.jpg', alt: 'Reel : le Venice Simplon-Orient-Express ajoute Monaco à son parcours' },
      { href: IG + 'DeMzSwpNd6U/', img: 'assets/reel-monaco2027.jpg', alt: 'Reel : quelle grande nouveauté va bouleverser Monaco en 2027 ?' },
      { href: IG + 'DeewuZkNlyQ/', img: 'assets/reel-adore.jpg', alt: 'Reel : Behind the set, Adore' },
      { href: IG + 'DegofIXNYDC/', img: 'assets/reel-noel.jpg', alt: 'Reel : le grand voyage de Noël à bord du Monte-Carlo Express' },
      { href: IG + 'Dd03cChNMPQ/', img: 'assets/reel-loveboat.jpg', alt: 'Reel : Love Boat, Radio Monaco x La Brasserie' },
      { href: IG + 'DejS7aONvSI/', img: 'assets/reel-gta.jpg', alt: 'Reel : GTA VI, le nouveau titre de Justice déjà sur Radio Monaco' },
      { href: IG + 'DeMC9c8tsHg/', img: 'assets/reel-cerveau.jpg', alt: 'Reel : notre cerveau, meilleur ami ou pire ennemi ?' }
    ];

    const djs = [
      { name: 'Jem’S', show: 'Sidekick Radio Show', img: 'assets/dj-jems.jpg' },
      { name: 'Pampa', show: 'Week-end Change · Night Mood', img: 'assets/dj-pampa.jpg' },
      { name: 'Adore', show: 'Timeless', img: 'assets/dj-adore.jpg' },
      { name: 'Dj Eight & Gil Martin', show: 'House Therapy', img: 'assets/dj-housetherapy.jpg' },
      { name: 'La Cartoucherie', show: 'Deelighted', img: 'assets/dj-cartoucherie.jpg' },
      { name: 'Matt Forti', show: 'Good Vibes', img: 'assets/dj-mattforti.jpg' },
      { name: 'Mynarya', show: 'Golden Hour', img: 'assets/dj-mynarya.jpg' },
      { name: 'Rhum G', show: 'Sunny Time', img: 'assets/dj-rhumg.jpg' },
      { name: 'Yan One', show: 'L’After Chic', img: 'assets/dj-yanone.jpg' }
    ];

    const podList = [
      { title: 'Le Morning « Made in Monte-Carlo »', sub: 'Le replay du 19 octobre', tag: 'Replay', img: 'assets/show-morning.jpg', pos: '60% 50%' },
      { title: 'L’horoscope du jour', sub: 'Les 12 signes, chaque matin', tag: 'Horoscope', img: 'assets/rm-night.jpg', pos: '50% 40%' },
      { title: 'La Tendance des marchés', sub: 'Inflation américaine : les marchés surpris', tag: 'Marchés', img: 'assets/rm-yacht.jpg', pos: '50% 50%' },
      { title: 'Good Vibes by Matt Forti', sub: '100 % Mix DJ', tag: 'DJ set', img: 'assets/show-goodvibes.jpg', pos: '70% 50%' },
      { title: 'Golden Hour by Mynarya', sub: '100 % Mix DJ', tag: 'DJ set', img: 'assets/show-goldenhour.jpg', pos: '70% 50%' },
      { title: 'Deelighted by La Cartoucherie', sub: '100 % Mix DJ', tag: 'DJ set', img: 'assets/show-deelighted.jpg', pos: '70% 50%' },
      { title: 'L’After Chic by Yan One', sub: '100 % Mix DJ', tag: 'DJ set', img: 'assets/show-afterchic.jpg', pos: '70% 50%' }
    ];

    const hdr = scrolled
      ? { light: false, dark: true, fg: '#121116', bg: 'rgba(250,248,245,.9)', line: 'rgba(18,17,22,.08)' }
      : { light: true, dark: false, fg: '#FFFFFF', bg: 'rgba(250,248,245,0)', line: 'rgba(255,255,255,0)' };

    return {
      motionClass: motion ? '' : 'motion-off',
      hdr, now, hero, news, headlines, team, teamList, radios, pl, reelList, djs, podList,
      reels: this.slider('reels'), djsS: this.slider('djs'), pods: this.slider('pods'),
      playing, notPlaying: !playing,
      eqState: playing ? 'running' : 'paused',
      togglePlay: () => this.playStation(station, !playing),
      playLabel: playing ? 'Mettre en pause' : 'Écouter le direct',
      headerLabel: playing ? 'En écoute' : 'Écouter',
      heroLabel: playing ? 'Pause' : 'Écouter le direct',
      videoRef: (el) => { if (el && !el._rmInit) { el._rmInit = true; el.muted = true; el.playsInline = true; const p = el.play && el.play(); if (p && p.catch) p.catch(() => {}); } }
    };
  }
}

DCRender(Component, document.getElementById('tpl'), document.getElementById('app'), { motion: true });
</script>
