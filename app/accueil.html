<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accueil</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style type="text/css">
/* Accueil de l'application (widget « Custom Code » de la home), 22 novembre 2026.
   Choix de Nicolas : les 4 radios à leur place, puis le sommaire de la piste D (Podcasts, Actualités, Jeux, Favoris),
   Thème clair (22 novembre), piste D : page crème unie ; la pochette du titre en cours n'apparaît, floutée, que dans la carte de la radio qui joue.
   Barre du lecteur en bas et écran verrouillé (pochette, titre) depuis le 22 novembre.
   Le son est partagé avec le reste de l'application (H.__rmAudio). */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#F6F3EE;font-family:Barlow,system-ui,sans-serif;color:#141218;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{overflow-y:auto;-webkit-overflow-scrolling:touch}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus,button:focus-visible{outline:none}
img{display:block}

/* fond crème uni : l'en-tête de GoodBarber se fond dans la page (piste D, 22 novembre) */
.pg{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:6px 14px calc(112px + env(safe-area-inset-bottom))}

/* les quatre radios */
.ls{display:flex;flex-direction:column;gap:8px}
.r{position:relative;display:flex;align-items:center;gap:14px;width:100%;height:80px;padding:0 12px 0 9px;border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 1px 2px rgba(20,18,24,.05);transition:color .3s .12s,transform .25s cubic-bezier(.2,.8,.2,1)}
.r:active{transform:scale(.97)}
.cv{width:62px;height:62px;flex:none;border-radius:15px;object-fit:cover;background:rgba(20,18,24,.06);transition:opacity .25s}
.cv.out{opacity:0}
.mid{flex:1;min-width:0;position:relative;height:100%}
.lg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .25s,transform .4s cubic-bezier(.2,.8,.2,1)}
.lg img{height:46px;width:auto}
.tx{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(8px);transition:opacity .35s .18s,transform .5s .18s cubic-bezier(.2,.8,.2,1)}
.tx em{display:flex;align-items:center;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.8;white-space:nowrap}
.tx b{margin-top:3px;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx i{font-style:normal;font-size:13.5px;opacity:.62;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:7px}
.eq s{width:3px;border-radius:1px;background:var(--c);height:4px}
.r.on:not(.wait) .eq s{animation:eq 1s ease-in-out infinite}
.eq s:nth-child(2){animation-delay:-.4s!important}.eq s:nth-child(3){animation-delay:-.7s!important}
@keyframes eq{0%,100%{height:4px}50%{height:11px}}
.pl{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;transition:background .45s,color .45s}
.pl svg{display:block}
.r{overflow:hidden}
.r>*{position:relative;z-index:1}
.r>.ink{position:absolute;z-index:0;inset:0;background:#141218;clip-path:circle(0 at calc(100% - 34px) 50%);transition:clip-path .6s cubic-bezier(.65,0,.25,1)}
.r.on>.ink{clip-path:circle(150% at calc(100% - 34px) 50%)}
.r>.blr{position:absolute;z-index:0;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.5) brightness(.6);opacity:0;transition:opacity .5s}
.r.on>.blr{opacity:1;transition:opacity .7s .3s}
.r.on{color:#fff}
.r.on .pl{background:#fff;color:var(--c)}
.r.on .eq s{background:#fff}
.r.on .lg{opacity:0;transform:scale(.92)}.r.on .tx{opacity:1;transform:none}
/* en attente du son : un anneau tourne dans le bouton */
.r.wait .pl svg{display:none}
.r.wait .pl:after{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(20,18,24,.15);border-top-color:var(--c);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* au toucher : la carte s'encre depuis le bouton, puis rebondit légèrement */
.r.pop{animation:pop .55s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.97)}55%{transform:scale(1.015)}100%{transform:none}}

/* le sommaire */
.ed{margin:14px 8px 0;flex:1;display:flex;flex-direction:column;max-height:280px}
.ed a{color:inherit;text-decoration:none;-webkit-touch-callout:none}
.ed a{flex:1;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;border-bottom:1px solid rgba(20,18,24,.12)}
.ed a:first-child{border-top:1px solid rgba(20,18,24,.12)}
.ed b{font-size:30px;font-weight:300;letter-spacing:-.03em;line-height:1}
.ed small{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#9B969F;white-space:nowrap}
.ed a:active b{opacity:.6}
/* lien vers le lecteur, actif seulement sur la radio en écoute */
.r>.ro{position:absolute;z-index:2;left:0;right:64px;top:0;bottom:0;pointer-events:none}
.r.on>.ro{pointer-events:auto}
a.mb{color:inherit;text-decoration:none;-webkit-touch-callout:none}

/* apparition de la page (22 novembre) : les blocs montent en fondu, l'un après l'autre */
@keyframes rmIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rm-in{animation:rmIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + 60ms)}
@media (prefers-reduced-motion:reduce){.rm-in{animation:none}}

/* la barre du lecteur, en bas (22 novembre) : ce qu'on écoute, pause / lecture, et le lecteur au toucher */
.mb{position:fixed;z-index:5;left:14px;right:14px;bottom:calc(28px + env(safe-area-inset-bottom));height:66px;display:flex;align-items:center;gap:12px;padding:0 10px 0 9px;border-radius:22px;background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);box-shadow:0 14px 34px -14px rgba(20,18,24,.4),0 0 0 1px rgba(20,18,24,.05);transform:translateY(160%);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.mb.show{transform:none}
.mb img{width:48px;height:48px;flex:none;border-radius:12px;object-fit:cover;background:rgba(20,18,24,.06)}
.mbt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mbt em{display:flex;align-items:center;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.mbt b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbt i{font-style:normal;font-weight:400;color:#6A6570}
.mb .eq s{background:var(--c)}
.mb.on:not(.wait) .eq s{animation:eq 1s ease-in-out infinite}
.mbp{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.mb.wait .mbp svg{display:none}
.mb.wait .mbp:after{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}

/* le fil d'informations (piste D, 22 novembre) : une information à la fois, dans une carte, toutes les 4 secondes */
a.tk{position:relative;display:flex;align-items:center;gap:12px;height:66px;margin:14px 0 0;padding:0 14px 0 9px;border-radius:20px;background:rgba(255,255,255,.88);box-shadow:0 1px 2px rgba(20,18,24,.05);color:#141218;text-decoration:none;-webkit-touch-callout:none;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
a.tk:active{transform:scale(.98)}
.tk-s{position:relative;flex:1;min-width:0;height:100%}
.ts{position:absolute;inset:0;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(60%);transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1)}
.ts.on{opacity:1;transform:none}
.ts.out{opacity:0;transform:translateY(-60%)}
.ts img,.ts .ph{width:48px;height:48px;flex:none;border-radius:12px;object-fit:cover;background:rgba(20,18,24,.06)}
.ts .ph{background:#E4032E;display:grid;place-items:center}.ts .ph img{width:28px;height:28px;background:none;border-radius:0}
.ts span{min-width:0;display:flex;flex-direction:column;gap:3px}
.ts em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--c,#141218);white-space:nowrap}
.ts b{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-d{flex:none;display:flex;flex-direction:column;gap:4px}
.tk-d i{width:4px;height:4px;border-radius:2px;background:#D6D1CB;transition:height .4s,background .4s}
.tk-d i.on{height:12px;background:#141218}
</style>
</head>
<body>
<div class="pg">
  <div class="ls" id="ls"></div>
  <a class="tk rm-in" id="tkw" href="#" style="--i:4;display:none"><span class="tk-s" id="tk"></span><span class="tk-d" id="tkd"></span></a>
  <nav class="ed" id="ed"></nav>
</div>
<a class="mb" id="mb" href="#"><img id="mbc" alt=""><span class="mbt"><em><span class="eq"><s></s><s></s><s></s></span><span id="mbs"></span></em><b id="mbti"></b></span><button class="mbp" id="mbp" type="button" aria-label="Pause"></button></a>
<script>
var SITE = 'https://nikoprdn.github.io/RM-test/assets/';
var R = [
  { k: 'montecarlo', n: 'Monte-Carlo', lab: 'Monte Carlo', c: '#E4032E', sg: 'charte/sigle-montecarlo-invert@3x.png', st: 'https://radiomonaco.ice.infomaniak.ch/radiomonaco-128.mp3', sec: 79602094, slug: 'monte-carlo-lecteur-sur-mesure' },
  { k: 'paris', n: 'Paris', lab: 'Paris', c: '#E4032E', sg: 'charte/sigle-montecarlo-invert@3x.png', st: 'https://radiomonacoparis.ice.infomaniak.ch/radiomonacoparis-320.aac', meta: 'https://radiomonaco.ice.infomaniak.ch/radiomonaco-128.mp3', sec: 79602477, slug: 'paris-1' },
  { k: 'mixdj', n: '100 % Mix DJ', lab: '100% Mix', c: '#F59C00', sg: 'charte/sigle-mixdj-invert@3x.png', st: 'https://mixdj.ice.infomaniak.ch/mixdj-128.aac', fixed: true, sec: 79602480, slug: '100-mix-dj-2' },
  { k: 'nightmood', n: 'Night Mood', lab: 'Night Mood', c: '#8A5AA1', sg: 'charte/sigle-nightmood-invert@3x.png', st: 'https://nightmood.ice.infomaniak.ch/nightmood-128.aac', sec: 79602481, slug: 'night-mood-1' }
];
/* le sommaire : sections de l'application */
var MENU = [
  { t: 'Podcasts', s: '', sec: 79503683, slug: 'podcasts-2', k: 'pod' },
  { t: 'Actualités', s: 'Monaco & Riviera', sec: 79601016, slug: 'actualites' },
  { t: 'Jeux', s: 'À l’antenne', sec: 79620298, slug: 'jeux' },
  { t: 'Favoris', s: '', sec: 79503689, slug: 'favorites' }
];
var IC_PLAY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
var IC_PAUSE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
var IC_ARROW = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var $ = function (id) { return document.getElementById(id); };
var byK = {};
R.forEach(function (r) { r.meta = r.meta || r.st; r.t = 'Radio Monaco ' + r.n; r.a = 'En direct'; r.cover = SITE + r.sg; byK[r.k] = r; });

/* ——— le son partagé avec les pages radio ——— */
var H = window;
try { if (window.parent && window.parent !== window && window.parent.document) H = window.parent; } catch (e) { H = window; }
var au = H.__rmAudio;
if (!au) { au = H.document.createElement('audio'); au.preload = 'none'; au.setAttribute('playsinline', ''); au.style.display = 'none'; H.document.body.appendChild(au); H.__rmAudio = au; }
var waitK = '';
function live() { return au.src && !au.paused && H.__rmRadio ? H.__rmRadio : ''; }

/* ——— navigation vers une section ——— */
/* Les liens sont de vrais liens <a href="testnicolas://#!section=ID"> : dans l'application, c'est le toucher
   d'un lien qui ouvre la section (une navigation lancée par le script ne marche pas sur le téléphone).
   Dans le banc d'essai (aperçu web), on intercepte le lien et on navigue par l'historique de l'aperçu. */
function link(sec) { return 'testnicolas://#!section=' + sec; }
function preview() { try { return window.parent && window.parent !== window && !!window.parent.history && /^\/pview\//.test(window.parent.location.pathname); } catch (e) { return false; } }
function go(slug, sec) {
  if (!sec) return;
  try { var P = window.parent;
    if (P && P !== window && P.history) {
      var m = P.location.pathname.match(/^\/pview\/[^\/]+\//);
      P.history.pushState({}, '', (m ? m[0] : '/') + slug);
      P.dispatchEvent(new PopStateEvent('popstate', { state: {} })); return; }
  } catch (err) {}
  location.href = 'testnicolas://#!section=' + sec;   /* lien inter-sections de l'application */
}

/* ——— les quatre lignes ——— */
$('ls').innerHTML = R.map(function (r, i) {
  return '<div class="r rm-in" data-k="' + r.k + '" style="--c:' + r.c + ';--i:' + i + '" role="button" tabindex="0">' +
    '<span class="ink"></span><span class="blr"></span><img class="cv" alt="">' +
    '<a class="ro" href="' + link(r.sec) + '" data-slug="' + r.slug + '" aria-label="Ouvrir le lecteur Radio Monaco ' + r.n + '"></a>' +
    '<span class="mid"><span class="lg"><img src="' + SITE + 'wr-' + r.k + '-ink.png" alt="Radio Monaco ' + r.n + '"></span>' +
    '<span class="tx"><em><span class="eq"><s></s><s></s><s></s></span>En direct – ' + r.lab + '</em><b></b><i></i></span></span>' +
    '<button class="pl" type="button" aria-label="Écouter"></button></div>';
}).join('');
var rows = {}; [].forEach.call($('ls').children, function (b) { rows[b.getAttribute('data-k')] = b; });

/* ——— le sommaire ——— */
$('ed').innerHTML = MENU.map(function (m, i) {
  return '<a class="rm-in" style="--i:' + (i + 5) + '" href="' + link(m.sec) + '" data-slug="' + m.slug + '" data-i="' + i + '"><b>' + m.t + '</b><small><span id="ms' + i + '">' + m.s + '</span>' + IC_ARROW + '</small></a>';
}).join('');

function paintBg() {}   /* plus de fond de page : la pochette floutée vit dans la carte (paintRow) */

/* ——— la barre du bas et l'écran verrouillé suivent la radio en écoute ——— */
var barK = '';
function paintBar() {
  var k = live() || waitK, mb = $('mb');
  if (k) barK = k;
  mb.classList.toggle('show', !!k || (!!barK && !!au.src));
  if (!barK) return;
  var r = byK[barK];
  mb.style.setProperty('--c', r.c);
  mb.classList.toggle('on', !!k); mb.classList.toggle('wait', waitK === barK);
  if ($('mbc').getAttribute('src') !== r.cover) $('mbc').src = r.cover;
  $('mbs').textContent = 'En direct – ' + r.lab;
  $('mbti').innerHTML = esc(r.t) + (r.a && r.a !== 'En direct' ? ' <i>· ' + esc(r.a) + '</i>' : '');
  $('mbp').innerHTML = k ? IC_PAUSE : IC_PLAY;
  if (r.sec) { $('mb').setAttribute('href', link(r.sec)); $('mb').setAttribute('data-slug', r.slug); }
  if (k === barK) lock(r);
}
function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
/* écran verrouillé : titre, artiste et pochette (Media Session), sur la page qui porte le son */
var lockKey = '';
function lock(r) {
  var nav = H.navigator || navigator; if (!nav || !('mediaSession' in nav)) return;
  var key = r.k + '|' + r.t + '|' + r.cover; if (key === lockKey) return; lockKey = key;
  try {
    var MM = H.MediaMetadata || MediaMetadata;
    nav.mediaSession.metadata = new MM({ title: r.t, artist: r.a && r.a !== 'En direct' ? r.a : 'Radio Monaco ' + r.n, album: 'Radio Monaco ' + r.n,
      artwork: [{ src: r.cover, sizes: '600x600', type: /\.png/i.test(r.cover) ? 'image/png' : 'image/jpeg' }] });
    nav.mediaSession.setActionHandler('play', function () { au.play().catch(function () {}); });
    nav.mediaSession.setActionHandler('pause', function () { au.pause(); });
  } catch (e) {}
}
function swap(img, src) {
  if (img.getAttribute('src') === src) return;
  if (!img.getAttribute('src')) { img.src = src; return; }
  img.classList.add('out'); setTimeout(function () { img.onload = function () { img.classList.remove('out'); }; img.src = src; }, 200);
}
function paintRow(r) {
  var b = rows[r.k];
  swap(b.querySelector('.cv'), r.cover);
  b.querySelector('.blr').style.backgroundImage = 'u' + 'rl("' + r.cover + '")';
  if (r.k === barK) paintBar();
  b.querySelector('b').textContent = r.t; b.querySelector('i').textContent = r.a;
}
function paintState() {
  var on = live();
  R.forEach(function (r) {
    var b = rows[r.k], w = waitK === r.k, act = on === r.k || w;
    b.classList.toggle('on', act); b.classList.toggle('wait', w);
    var p = b.querySelector('.pl'); p.innerHTML = act ? IC_PAUSE : IC_PLAY;
    p.setAttribute('aria-label', (act ? 'Pause ' : 'Écouter ') + 'Radio Monaco ' + r.n);
  });
  paintBg(); paintBar();
}

/* ——— écouter, mettre en pause, ouvrir la page de la radio ——— */
function play(r) {
  if (live() === r.k || waitK === r.k) { au.pause(); au.removeAttribute('src'); au.load(); H.__rmRadio = ''; waitK = ''; paintState(); return; }
  H.__rmRadio = r.k; H.__rmSel = r.k; waitK = r.k; paintState();
  var row = rows[r.k]; row.classList.remove('rm-in', 'pop'); void row.offsetWidth; row.classList.add('pop'); setTimeout(function () { row.classList.remove('pop'); }, 600);
  au.src = r.st + '?r=' + Date.now();
  au.play().catch(function () { setTimeout(function () { au.play().catch(function () { H.__rmRadio = ''; waitK = ''; paintState(); }); }, 500); });
}
document.addEventListener('click', function (e) {
  if (e && e.isTrusted === false) return;   /* GoodBarber simule des clics : seul un vrai toucher compte */
  if (e.target.closest('#mbp')) { e.preventDefault(); e.stopPropagation(); if (barK) { if (live()) { au.pause(); } else play(byK[barK]); } return; }
  /* un lien vers une section : dans l'appli, on laisse faire le lien ; dans l'aperçu, on navigue nous-mêmes */
  var a = e.target.closest('a[href^="testnicolas:"]');
  if (a) { if (preview()) { e.preventDefault(); go(a.getAttribute('data-slug'), 1); } return; }
  var row = e.target.closest('.r'); if (!row) return;
  var r = byK[row.getAttribute('data-k')];
  /* le bouton rond, ou une radio qui ne joue pas : écouter / pause ; la radio en écoute : ouvrir son lecteur */
  if (e.target.closest('.pl') || !row.classList.contains('on')) play(r); else go(r.slug, r.sec);
});
function onPlaying() { waitK = ''; paintState(); }
function onStop() { waitK = ''; paintState(); }
au.addEventListener('playing', onPlaying); au.addEventListener('pause', onStop); au.addEventListener('error', onStop);
window.addEventListener('pagehide', function () { au.removeEventListener('playing', onPlaying); au.removeEventListener('pause', onStop); au.removeEventListener('error', onStop); });

/* ——— titres et pochettes (mêmes sources que le site) ——— */
var nice = function (s) { s = (s || '').replace(/\s+/g, ' ').trim(); var l = s.replace(/[^A-Za-zÀ-ÿ]/g, ''); var up = l.replace(/[^A-ZÀ-Þ]/g, '').length; if (l.length && up / l.length > 0.6) s = s.toLowerCase().replace(/(^|[\s(\-&/])([a-zà-ÿ])/g, function (m, a, b) { return a + b.toUpperCase(); }); return s; };
function itunes(a, t) {
  if (!a) return Promise.resolve('');
  var q = encodeURIComponent((a.split(/ x | feat\. | & | vs |, /i)[0] + ' ' + t).replace(/\(.*?\)|\[.*?\]|feat\.?.*$/gi, ' ').replace(/\s+/g, ' ').trim());
  return fetch('https://itunes.apple.com/search?media=music&entity=song&limit=1&country=fr&term=' + q).then(function (x) { return x.json(); })
    .then(function (j) { var u = j.results && j.results[0] && j.results[0].artworkUrl100; return u ? u.replace('100x100bb', '600x600bb') : ''; }).catch(function () { return ''; });
}
function read(r) {
  fetch(r.meta + '.xspf?r=' + Date.now(), { cache: 'no-store' }).then(function (x) { return x.ok ? x.text() : ''; }).then(function (txt) {
    var n = txt && new DOMParser().parseFromString(txt, 'text/xml').querySelector('track > title');
    var raw = ((n && n.textContent) || '').trim();
    if (!raw || raw === r.raw || /^\s*radio monaco\b/i.test(raw)) return;   /* on garde le dernier vrai titre pendant les jingles */
    r.raw = raw; var p = raw.split(' - ');
    r.a = nice(p.length > 1 ? p[0] : ''); r.t = nice(p.length > 1 ? p.slice(1).join(' - ') : raw);
    paintRow(r);
    if (r.fixed) return;
    var hid = r.meta.replace(/^https?:\/\//, '').split('.')[0];
    fetch('https://metadata.infomaniak.com/api/radio/' + hid + '/metadata-all-cover', { cache: 'no-store' }).then(function (x) { return x.json(); })
      .then(function (j) { var hit = (j.data || []).filter(function (x) { return x.title && x.cover && x.title.trim().toLowerCase() === raw.toLowerCase(); })[0]; return hit ? hit.cover : itunes(r.a, r.t); })
      .catch(function () { return itunes(r.a, r.t); })
      .then(function (u) { r.cover = u || SITE + r.sg; paintRow(r); paintBg(); });
  }).catch(function () {});
}

/* ——— repère des podcasts : les épisodes publiés aujourd'hui ——— */
fetch('https://nikoprdn.github.io/RM-test/app-podcasts.json', { cache: 'no-cache' }).then(function (x) { return x.json(); }).then(function (j) {
  var t = new Date(), n = 0;
  (j.shows || []).forEach(function (s) { s.eps.forEach(function (e) { var d = new Date(e.d + 'Z'); if (d.toDateString() === t.toDateString()) n++; }); });
  $('ms0').textContent = n ? (n > 1 ? n + ' nouveaux' : '1 nouveau') : 'Le Morning & les mixs';
}).catch(function () { $('ms0').textContent = 'Le Morning & les mixs'; });

/* ——— le fil d'informations : une information à la fois ——— */
var SEC = { pod: [79503683, 'podcasts-2'], news: [79601016, 'actualites'], jeu: [79620298, 'jeux'] };
function ago(iso) {
  if (!iso) return '';
  var d = new Date(/Z|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z'), t = new Date(), h = Math.round((t - d) / 36e5);
  if (h < 1) return 'À l’instant'; if (h < 24) return 'Il y a ' + h + ' h';
  var j = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return j <= 1 ? 'Hier' : j < 14 ? 'Il y a ' + j + ' jours' : 'Il y a ' + Math.round(j / 7) + ' semaines';
}
var TK = [], tkI = 0, tkHold = false;
fetch('https://nikoprdn.github.io/RM-test/app-une.json', { cache: 'no-cache' }).then(function (x) { return x.json(); }).then(function (j) {
  /* quatre informations seulement (consigne du 22 novembre) : le jeu d'abord, deux fois plus longtemps,
     puis la dernière émission, le dernier mix, la dernière actualité */
  var g = (j.jeux || [])[0], e = j.pod, m = j.mix, n = (j.news || [])[0];
  TK.push(g ? { k: 'jeu', c: '#E4032E', img: '', lab: 'Jeu', t: g.t, ms: 8000 } : { k: 'jeu', c: '#E4032E', img: '', lab: 'Jeux', t: 'Bientôt à l’antenne', ms: 8000 });
  if (e) TK.push({ k: 'pod', c: '#E4032E', img: e.img, lab: 'Podcast', t: e.show + ' · ' + e.t, d: e.d, ms: 4000 });
  if (m) TK.push({ k: 'pod', c: '#F59C00', img: m.img, lab: 'Mix', t: m.show + ' · ' + m.t, d: m.d, ms: 4000 });
  if (n) TK.push({ k: 'news', c: '#141218', img: n.img, lab: n.cat || 'Actualité', t: n.t, d: n.d, ms: 4000 });
  if (!TK.length) return;
  $('tk').innerHTML = TK.map(function (x, n) {
    var pic = x.img ? '<img src="' + esc(x.img) + '" alt="" loading="lazy">' : '<i class="ph"><img src="' + SITE + 'charte/sigle-montecarlo-invert@3x.png" alt=""></i>';
    var when = ago(x.d);
    return '<span class="ts' + (n ? '' : ' on') + '" style="--c:' + x.c + '">' + pic + '<span><em>' + esc(x.lab) + (when ? ' · ' + when : '') + '</em><b>' + esc(x.t) + '</b></span></span>';
  }).join('');
  $('tkd').innerHTML = TK.map(function (x, n) { return '<i' + (n ? '' : ' class="on"') + '></i>'; }).join('');
  $('tkw').style.display = ''; tkLink(); tkPlan();
}).catch(function () {});
function tkLink() { var s = SEC[TK[tkI].k]; $('tkw').setAttribute('href', link(s[0])); $('tkw').setAttribute('data-slug', s[1]); }
function tkPlan() { setTimeout(function () { tkNext(); tkPlan(); }, TK[tkI].ms || 4000); }
function tkNext() {
  if (tkHold || document.hidden || TK.length < 2) return;
  var sl = $('tk').children, cur = sl[tkI], n = (tkI + 1) % TK.length, nx = sl[n];
  cur.classList.remove('on'); cur.classList.add('out');
  nx.classList.remove('out'); nx.style.transition = 'none'; nx.classList.remove('on'); void nx.offsetWidth; nx.style.transition = ''; nx.classList.add('on');
  setTimeout(function () { cur.classList.remove('out'); }, 650);
  tkI = n; tkLink();
  var d = $('tkd').children; for (var k = 0; k < d.length; k++) d[k].classList.toggle('on', k === tkI % d.length);
}
['touchstart', 'mousedown'].forEach(function (ev) { $('tkw').addEventListener(ev, function () { tkHold = true; }, { passive: true }); });
['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(function (ev) { $('tkw').addEventListener(ev, function () { setTimeout(function () { tkHold = false; }, 2000); }, { passive: true }); });

R.forEach(paintRow); paintState();
R.forEach(read); setInterval(function () { R.forEach(read); }, 20000); setInterval(paintState, 3000);
</script>
