<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeux</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style type="text/css">
/* Section « Jeux », piste H « la vitrine » choisie par Nicolas le 22 novembre 2026 :
   les jeux en lignes comme les radios de l'accueil (en cours, puis « Bientôt ») ; la fiche du jeu en « studio » sombre, puis l'inscription.
   Les jeux viennent d'app-une.json (liste JEUX de rm-site/src/pages/app-une.json.js). */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:#F6F3EE;font-family:Barlow,system-ui,sans-serif;color:#141218;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.pg{padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.hd{padding:0 6px}.hd h1{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hd p{font-size:14px;color:#6A6570;margin-top:6px}

/* les jeux en lignes, comme les quatre radios de l'accueil (demande de Nicolas, 22 novembre) */
.ls{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.r{position:relative;display:flex;align-items:center;gap:14px;height:80px;padding:0 12px 0 9px;border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 1px 2px rgba(20,18,24,.05);color:inherit;text-decoration:none;overflow:hidden;-webkit-touch-callout:none;transition:color .3s .12s,transform .25s cubic-bezier(.2,.8,.2,1)}
.r:active{transform:scale(.97)}
.r>*{position:relative;z-index:1}
.r .cv{width:62px;height:62px;flex:none;border-radius:15px;object-fit:cover;background:rgba(20,18,24,.06)}
.r .cv.asm{background:linear-gradient(35deg,#D50B32 0 57%,#B9975B 57% 59%,#FFFFFF 59%);display:flex;align-items:flex-end;padding:0 0 7px 8px;color:#fff;font-size:12px;font-weight:800;letter-spacing:.02em}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.mid em{display:flex;align-items:center;gap:7px;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;color:#6A6570;font-variant-numeric:tabular-nums}
.mid em i{width:6px;height:6px;border-radius:50%;background:var(--c);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.mid b{margin-top:3px;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid>span{font-size:13.5px;color:#6A6570;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;transition:background .45s,color .45s}
.r.nx .pl{background:none;box-shadow:inset 0 0 0 1.5px rgba(20,18,24,.18);color:#6A6570}
.r.nx .cv{filter:grayscale(.3)}
.ex{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border-radius:6px;background:rgba(20,18,24,.07);color:#6A6570}
.r .cv.mt2{background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(20,18,24,.06)}.r .cv.mt2 img{height:48px;width:auto;max-width:none}
/* au toucher : la ligne s'encre depuis le bouton, comme une radio qu'on lance, puis la feuille monte */
.r>.ink{position:absolute;z-index:0;inset:0;background:#141218;clip-path:circle(0 at calc(100% - 34px) 50%);transition:clip-path .6s cubic-bezier(.65,0,.25,1)}
.r>.blr{position:absolute;z-index:0;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) saturate(1.5) brightness(.6);opacity:0;transition:opacity .5s}
.r.on>.ink{clip-path:circle(150% at calc(100% - 34px) 50%)}
.r.on>.blr{opacity:1;transition:opacity .7s .3s}
.r.on{color:#fff}.r.on .mid em,.r.on .mid>span{color:rgba(255,255,255,.75)}.r.on .mid em i{background:#fff}
.r.on .pl{background:#fff;color:var(--c)}
.r.on .ex{background:rgba(255,255,255,.18);color:#fff}

.vd{margin-top:18px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:rgba(20,18,24,.04)}
.vd img{width:40px;height:40px;border-radius:11px;flex:none}
.vd h2{font-size:16px;font-weight:600;letter-spacing:-.01em}.vd p{font-size:13px;color:#6A6570;margin-top:2px;line-height:1.35}
.rg{display:block;text-align:center;margin-top:22px;font-size:12px;color:#6A6570}

/* la fiche du jeu, piste 3 « le studio » (choisie le 22 novembre) : la mise en scène du lecteur plein écran,
   sombre, la photo floutée en fond, la photo nette au centre comme une pochette ; puis l'inscription sur le même fond. */
.dim{position:fixed;inset:0;z-index:20;background:rgba(20,18,24,.5);opacity:0;pointer-events:none;transition:opacity .35s}
.sh{position:fixed;left:0;right:0;bottom:0;top:6px;z-index:21;background:#121015;color:#fff;border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .55s cubic-bezier(.2,.85,.2,1);display:flex;flex-direction:column;overflow:hidden}
.op .dim{opacity:1;pointer-events:auto}.op .sh{transform:none}
.sh .bgc{position:absolute;inset:-80px;object-fit:cover;width:calc(100% + 160px);height:calc(100% + 160px);filter:blur(60px) saturate(1.4) brightness(.6);opacity:.95}
.sh .bgc.rouge{background:radial-gradient(60% 45% at 30% 25%,#D50B32,transparent),radial-gradient(50% 40% at 80% 30%,#7a0a22,transparent)}
.sh .bgs{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,16,21,.1) 0%,rgba(18,16,21,.45) 50%,#121015 92%)}
.sh>*{position:relative}
.tp{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0;flex:none}
.tp span{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
.x{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.sc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 24px 20px;display:flex;flex-direction:column}
.cvg{width:min(290px,72vw,34vh);aspect-ratio:1;margin:min(22px,3vh) auto 0;border-radius:22px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.85);flex:none}
.cvg img{width:100%;height:100%;object-fit:cover}
.cvg.match{background:#fff;display:flex;align-items:center;justify-content:center;gap:8%;padding:0 8%}
.cvg.match img{width:auto;height:46%;object-fit:contain}.cvg.match span{white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6A6570;text-align:center;line-height:1.4}
.cvg.match span b{display:block;font-size:20px;color:#141218;letter-spacing:0;text-transform:none}
.inf{text-align:center;margin-top:min(24px,3vh)}
.inf small{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;opacity:.85}
.inf small i{width:7px;height:7px;border-radius:50%;background:#E4032E;box-shadow:0 0 10px #E4032E}
.inf h3{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.08;margin-top:8px}.inf p{font-size:14px;opacity:.65;margin-top:5px}
.ln{display:flex;margin-top:min(20px,2.6vh);border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14)}
.ln div{flex:1;text-align:center;padding:11px 0}.ln div+div{border-left:1px solid rgba(255,255,255,.14)}
.ln small{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;font-weight:700}.ln b{display:block;font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.ds{text-align:center;color:rgba(255,255,255,.6);font-size:13px;line-height:1.45;margin-top:16px}
/* ce qu'on offre : le programme du lot */
.pgm{margin-top:22px}.pgm h4{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-bottom:4px}
.pgm div{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.pgm div:last-child{border-bottom:0}
.pgm i{flex:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.09);display:grid;place-items:center}
.pgm p{flex:1;min-width:0}.pgm b{display:block;font-size:15px;font-weight:600}.pgm span{display:block;font-size:12.5px;color:rgba(255,255,255,.55);margin-top:1px;line-height:1.35}
.cd2{margin-top:6px;font-size:12px;color:rgba(255,255,255,.45);text-align:center;line-height:1.45}
/* l'inscription */
.fm h3{font-size:27px;font-weight:300;letter-spacing:-.02em;margin-top:10px}.fm h3 b{font-weight:700}
.fm .s{font-size:13px;opacity:.55;margin-top:4px}
.mini{display:flex;align-items:center;gap:12px;margin-top:14px}
.mini .im{width:52px;height:52px;border-radius:12px;overflow:hidden;flex:none;background:#fff;display:flex;align-items:center;justify-content:center}.mini .im img{width:100%;height:100%;object-fit:cover}.mini .im.match img{width:auto;height:70%;object-fit:contain}
.mini b{font-size:16px;font-weight:600}.mini small{display:block;font-size:12px;opacity:.55;margin-top:2px}
.f{display:flex;align-items:center;margin-top:10px;height:52px;border-radius:16px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.1);padding:0 18px;transition:border-color .2s,background .2s}
.f span{width:84px;flex:none;font-size:12px;opacity:.5}
.f input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:#fff}
.f:focus-within{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.11)}
.f.ko{border-color:#E4032E;box-shadow:0 0 0 3px rgba(228,3,46,.2)}
.ck{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.4}
.ck input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(255,255,255,.35);background:none;margin-top:1px;display:grid;place-items:center}
.ck input:checked{background:#fff;border-color:#fff}
.ck input:checked:after{content:"";width:6px;height:10px;border:solid #121015;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ck.ko input{border-color:#E4032E}.ck a{color:#fff}
.nt{margin-top:14px;font-size:12px;color:rgba(255,255,255,.5);line-height:1.45}
.ft{flex:none;padding:12px 22px calc(16px + env(safe-area-inset-bottom))}
.go{display:flex;width:100%;height:56px;border-radius:28px;border:0;background:#fff;color:#121015;align-items:center;justify-content:center;font-size:16px;font-weight:700;text-decoration:none;transition:transform .15s}
.go:active{transform:scale(.98)}
.er{font-size:12.5px;color:#ff5d76;text-align:center;margin-bottom:8px}
.ok{text-align:center;margin:auto 0;padding:20px 0}
.ok i{width:68px;height:68px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 20px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ok h3{font-size:28px;font-weight:300;letter-spacing:-.02em}.ok h3 b{display:block;font-weight:700}
.ok p{font-size:14px;color:rgba(255,255,255,.65);margin-top:12px;line-height:1.5}
.vu{animation:vu .45s cubic-bezier(.2,.8,.2,1) both}@keyframes vu{from{opacity:0;transform:translateY(14px)}}

@keyframes rmIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rm-in{animation:rmIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + 60ms)}
@media (prefers-reduced-motion:reduce){.rm-in,.ok i{animation:none}.sh,.dim{transition:none}}
</style>
</head>
<body>
<div class="pg" id="pg">
  <div class="hd rm-in"><h1>Jeux</h1><p>Des lots d’exception, réservés aux auditeurs.</p></div>
  <div id="ls"></div>
  <a class="rg rm-in" style="--i:4" href="https://radio-monaco.com/reglement-jeux-concours/" target="_blank" rel="noopener">Règlement des jeux-concours</a>
</div>
<div id="md"><div class="dim" id="dim"></div><div class="sh" id="sh" role="dialog" aria-modal="true" aria-label="Participer au jeu"></div></div>

<script>
(function () {
var BASE = 'https://nikoprdn.github.io/RM-test/';
var REGLEMENT = 'https://radio-monaco.com/reglement-jeux-concours/';
/* Le règlement prévoit l'inscription par e-mail à cette adresse : sans service d'envoi (« envoi »), le bouton prépare ce message. */
var MAIL = 'jeu@radio-monaco.com';
/* Montré tant qu'aucun jeu n'est saisi dans JEUX (app-une.json.js) : la page garde son allure, marquée « Exemple ». */
var EXEMPLE = [
  { id: 'exemple', t: 'Deux nuits à Monte-Carlo', sous: 'Suite vue mer, dîner étoilé pour deux et accès au spa.',
    img: BASE + 'assets/rm-casino.jpg', valeur: '2 400 €', gagnants: 1, fin: plusJours(8, 14), exemple: true },
  { id: 'exemple-asm', theme: 'asm', t: 'Vos places pour le Stade Louis-II', sous: 'Deux places en tribune présidentielle pour le prochain match de l’AS Monaco à domicile.',
    valeur: '2 places', gagnants: 5, fin: plusJours(3, 6), evenement: 'Match à domicile', exemple: true },
  { id: 'exemple-2', t: 'Une soirée au studio', sous: 'Vivez une émission en direct, aux côtés de l’équipe.',
    img: BASE + 'assets/rm-studio-2.jpg', debut: plusJours(12, 0), exemple: true }
];
var JEUX = [], cur = null, timer = 0;

function plusJours(j, h) { var d = new Date(Date.now() + j * 864e5 + h * 36e5); return d.toISOString(); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function dt(s, matin) { if (!s) return null; var d = new Date(s.length === 10 ? s + (matin ? 'T00:00:00' : 'T23:59:59') : s); return isNaN(d) ? null : d; }
var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
var MOISL = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function jour(d, long) { var n = d.getDate(); return (n === 1 ? '1er' : n) + ' ' + (long ? MOISL : MOIS)[d.getMonth()]; }
function reste(d) {
  var s = Math.max(0, d - Date.now()) / 1000, j = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return j ? j + ' j ' + h + ' h' : h ? h + ' h ' + (m < 10 ? '0' : '') + m : m + ' min';
}
function gagnent(j) { if (j.gagne) return j.gagne; var n = +j.gagnants || 0; return n > 1 ? 'Les ' + n + ' premiers inscrits gagnent' : n === 1 ? 'Le premier inscrit gagne' : ''; }
function img(s) { return s && !/^https?:/.test(s) ? BASE + s.replace(/^\//, '') : s; }

/* ---------- la page ---------- */
function render() {
  var now = Date.now();
  var enCours = JEUX.filter(function (j) { var d = dt(j.debut, 1), f = dt(j.fin); return (!d || d <= now) && (!f || f > now); });
  var bientot = JEUX.filter(function (j) { var d = dt(j.debut, 1); return d && d > now; })
    .sort(function (a, b) { return dt(a.debut, 1) - dt(b.debut, 1); });
  var h = '', i = 1;
  var plus = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  var chev = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
  function ligne(j, avenir) {
    var asm = j.theme === 'asm' || j.theme === 'match', f = dt(j.fin), d = dt(j.debut, 1);
    var em = avenir ? 'Bientôt · ' + jour(d, 1) : '<i></i>En cours' + (f ? ' · <span class="tm" data-fin="' + f.toISOString() + '">' + reste(f) + '</span>' : '');
    return '<a class="r' + (avenir ? ' nx' : '') + ' rm-in" style="--i:' + (i++) + ';--c:' + (asm ? '#D50B32' : '#E4032E') + '" href="#" data-id="' + esc(j.id) + '">' +
      '<span class="ink"></span>' + (j.img ? '<img class="blr" src="' + esc(img(j.img)) + '" alt="">' : '') +
      (j.theme === 'match' && j.logos ? '<span class="cv mt2"><img src="' + esc(img(j.logos[0])) + '" alt=""></span>' : asm ? '<span class="cv asm">ASM</span>' : '<img class="cv" src="' + esc(img(j.img)) + '" alt="">') +
      '<span class="mid"><em>' + em + (j.exemple ? ' <span class="ex">Exemple</span>' : '') + '</em><b>' + esc(j.t) + '</b><span>' +
      esc(avenir ? (j.sous || '') : (gagnent(j) || j.sous || '')) + '</span></span>' +
      '<span class="pl">' + (avenir ? chev : plus) + '</span></a>';
  }
  enCours.forEach(function (j) { h += ligne(j, false); });
  bientot.forEach(function (j) { h += ligne(j, true); });
  if (!enCours.length) {
    var p1 = bientot[0] && dt(bientot[0].debut, 1);
    h = '<div class="vd rm-in" style="--i:1"><img src="' + BASE + 'assets/charte/sigle-montecarlo-invert@3x.png" alt=""><div><h2>Pas de jeu en ce moment</h2><p>' +
      (p1 ? 'Prochaines inscriptions le ' + ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'][p1.getDay()] + ' ' + jour(p1, 1) + '.' : 'Le prochain jeu sera annoncé à l’antenne.') + '</p></div></div>' + h;
  }
  var ls = document.getElementById('ls'); ls.className = 'ls'; ls.innerHTML = h;
}
function tick() {
  [].forEach.call(document.querySelectorAll('[data-fin]'), function (e) { e.textContent = reste(new Date(e.getAttribute('data-fin'))); });
  if (cur && document.getElementById('cd')) document.getElementById('cd').textContent = reste(dt(cur.fin));
}

/* ---------- la fiche (studio) et l'inscription ---------- */
var memo = {};
try { memo = JSON.parse(localStorage.getItem('rmJeuxCoord') || '{}'); } catch (e) {}
var XI = '<svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var BKI = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';
function champ(k, lab, type, ac) {
  return '<label class="f" data-k="' + k + '"><span>' + lab + '</span><input name="' + k + '" type="' + type + '" autocomplete="' + ac + '" value="' + esc(memo[k] || '') + '"' + (k === 'tel' ? ' inputmode="tel"' : '') + '></label>';
}
var IC = function (d) { return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; };
var ICO = {
  expo: IC('<path d="M3 17c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/><path d="M3 12c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/><path d="M3 7c2.5-2 4.5-2 7 0s4.5 2 7 0 3-1.5 4-1"/>'),
  jeu: IC('<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7.5 10.5v4M5.5 12.5h4"/><circle cx="15.5" cy="11.5" r=".9"/><circle cx="17.8" cy="13.8" r=".9"/>'),
  vr: IC('<path d="M3.5 9a2 2 0 012-2h13a2 2 0 012 2v5.5a2 2 0 01-2 2h-3.2l-1.6-2.2a.9.9 0 00-1.4 0L10.7 16.5H5.5a2 2 0 01-2-2z"/><circle cx="8" cy="11.5" r="1.4"/><circle cx="16" cy="11.5" r="1.4"/>'),
  atelier: IC('<path d="M12 3.5a8.5 8.5 0 100 17c1.2 0 1.8-.8 1.8-1.7 0-1.4-1.6-1.6-1.6-3 0-1 .8-1.8 1.8-1.8h2.2a4.3 4.3 0 004.3-4.3C20.5 6.6 16.7 3.5 12 3.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.3" r="1"/><circle cx="14.5" cy="7.3" r="1"/>'),
  film: IC('<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.2v5.6l4.8-2.8z"/>'),
  match: IC('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5l3.4 2.5-1.3 4h-4.2l-1.3-4z"/>')
};
function fond(j) { return (j.img ? '<img class="bgc" src="' + esc(img(j.img)) + '" alt="">' : '<div class="bgc rouge"></div>') + '<div class="bgs"></div>'; }
function pochette(j) {
  if (j.theme === 'match' && j.logos) { var q = dt(j.quand, 1);
    return '<div class="cvg match"><img src="' + esc(img(j.logos[0])) + '" alt=""><span>' + (q ? jour(q) : '') + '<b>vs</b></span><img src="' + esc(img(j.logos[1])) + '" alt=""></div>'; }
  return '<div class="cvg"><img src="' + esc(img(j.img)) + '" alt=""></div>';
}
function vignette(j) {
  return j.theme === 'match' && j.logos ? '<span class="im match"><img src="' + esc(img(j.logos[0])) + '" alt=""></span>' : '<span class="im"><img src="' + esc(img(j.img)) + '" alt=""></span>';
}
function ecran(j, haut, corps, pied) {
  var sh = document.getElementById('sh');
  sh.innerHTML = fond(j) + '<div class="tp">' + haut + '</div><div class="sc vu">' + corps + '</div>' + pied;
}
function ouvrir(j) {
  cur = j;
  var now = Date.now(), d = dt(j.debut, 1), f = dt(j.fin), q = dt(j.quand, 1), avenir = d && d > now;
  var etat = avenir ? 'Inscriptions le ' + jour(d, 1) : '<i></i>En cours' + (f ? ' · <span id="cd">' + reste(f) + '</span>' : '');
  var corps = pochette(j) + '<div class="inf"><small>' + etat + '</small><h3>' + esc(j.t) + '</h3>' +
    (q ? '<p>' + ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'][q.getDay()] + ' ' + jour(q, 1) + (j.lieu ? ' · ' + esc(j.lieu) : '') + '</p>' : '') + '</div>' +
    '<div class="ln">' + (j.valeur ? '<div><small>À gagner</small><b>' + esc(j.valeur) + '</b></div>' : '') +
    (j.gagnants ? '<div><small>Gagnants</small><b>' + esc(j.gagnants) + '</b></div>' : '') +
    (q ? '<div><small>Le</small><b>' + jour(q) + '</b></div>' : '') + '</div>' +
    '<div class="ds">' + esc(j.sous || '') + (avenir ? '<br><br>Les inscriptions ouvriront ici même : écoutez Radio Monaco pour ne pas les manquer.' : '') + '</div>' +
    (j.programme && j.programme.length ? '<div class="pgm"><h4>' + (j.valeur ? esc(j.valeur) + ' · au programme' : 'Au programme') + '</h4>' +
      j.programme.map(function (x) { return '<div><i>' + (ICO[x.i] || ICO.expo) + '</i><p><b>' + esc(x.t) + '</b>' + (x.d ? '<span>' + esc(x.d) + '</span>' : '') + '</p></div>'; }).join('') + '</div>' : '') +
    (j.retrait && !avenir ? '<div class="cd2">' + esc(gagnent(j) ? gagnent(j) + '. ' : '') + esc(j.retrait) + '</div>' : '');
  var pied = avenir ? '<div class="ft"><button class="go" id="ferme">J’ai compris</button></div>'
    : j.form && !j.envoi ? '<div class="ft"><a class="go" href="' + esc(j.form) + '" target="_blank" rel="noopener">Je m’inscris</a></div>'
    : '<div class="ft"><button class="go" id="ins">Je m’inscris</button></div>';
  ecran(j, '<span style="width:36px"></span><span>' + (avenir ? 'Bientôt' : 'Jeu du moment') + '</span><button class="x" id="x" aria-label="Fermer">' + XI + '</button>', corps, pied);
  document.getElementById('md').className = 'op';
  document.documentElement.style.overflow = 'hidden';
}
function inscription(j) {
  var f = dt(j.fin);
  var corps = '<div class="fm"><h3>Votre <b>inscription</b></h3><div class="mini">' + vignette(j) + '<div><b>' + esc(j.t) + '</b><small>' + esc(gagnent(j) || '') + (f ? ' · jusqu’au ' + jour(f, 1) : '') + '</small></div></div>' +
    champ('prenom', 'Prénom', 'text', 'given-name') + champ('nom', 'Nom', 'text', 'family-name') + champ('adresse', 'Adresse', 'text', 'street-address') +
    champ('email', 'E-mail', 'email', 'email') + champ('tel', 'Téléphone', 'tel', 'tel') +
    '<label class="ck" id="ck"><input type="checkbox" id="ok"><span>J’ai plus de 18 ans et j’accepte le <a href="' + esc(j.reglement || REGLEMENT) + '" target="_blank" rel="noopener">règlement des jeux</a>. Une inscription par foyer.</span></label>' +
    '<div class="nt">Les gagnants sont annoncés à l’antenne et prévenus par e-mail. ' + esc(j.retrait || 'Lot à retirer à Radio Monaco, 7 rue du Gabian, sur présentation d’une pièce d’identité, au plus tard 48 h avant l’événement.') + '</div></div>';
  ecran(j, '<button class="x" id="ret" aria-label="Retour">' + BKI + '</button><span>Inscription</span><button class="x" id="x" aria-label="Fermer">' + XI + '</button>', corps,
    '<div class="ft"><div class="er" id="er"></div><a class="go" id="go" href="mailto:' + MAIL + '">Valider mon inscription</a></div>');
}
function fermer() { setTimeout(function () { [].forEach.call(document.querySelectorAll('#ls .r.on'), function (r) { r.classList.remove('on'); }); }, 250); document.getElementById('md').className = ''; document.documentElement.style.overflow = ''; cur = null; }
function valider() {
  var sh = document.getElementById('sh'), bad = [], v = {};
  ['prenom', 'nom', 'adresse', 'email', 'tel'].forEach(function (k) {
    var inp = sh.querySelector('input[name="' + k + '"]'), s = inp.value.trim(); v[k] = s;
    var ko = !s || (k === 'adresse' && s.length < 8) || (k === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s)) || (k === 'tel' && s.replace(/\D/g, '').length < 8);
    inp.parentNode.classList.toggle('ko', ko); if (ko) bad.push(inp);
  });
  var ok = document.getElementById('ok'); document.getElementById('ck').classList.toggle('ko', !ok.checked);
  var er = document.getElementById('er');
  if (bad.length || !ok.checked) {
    er.textContent = bad.length ? 'Merci de compléter les champs en rouge.' : 'Merci de confirmer votre âge et le règlement.';
    (bad[0] || ok).scrollIntoView({ block: 'center', behavior: 'smooth' });
    return false;
  }
  er.textContent = '';
  try { localStorage.setItem('rmJeuxCoord', JSON.stringify(v)); memo = v; } catch (e) {}
  v.jeu = cur.t; v.id = cur.id; v.date = new Date().toISOString();
  var go = document.getElementById('go');
  if (cur.exemple) { go.textContent = 'Envoi…'; setTimeout(function () { merci('exemple'); }, 500); return false; }
  if (!cur.envoi) {
    /* message tout prêt pour jeu@radio-monaco.com : le vrai toucher sur le lien ouvre l'application Mail */
    go.href = 'mailto:' + MAIL + '?subject=' + encodeURIComponent('Inscription au jeu : ' + cur.t) + '&body=' + encodeURIComponent(
      'Bonjour,\n\nJe souhaite participer au jeu « ' + cur.t + ' ».\n\nPrénom : ' + v.prenom + '\nNom : ' + v.nom + '\nAdresse : ' + v.adresse +
      '\nE-mail : ' + v.email + '\nTéléphone : ' + v.tel + '\n\nJ’ai plus de 18 ans et j’accepte le règlement des jeux.\n\nEnvoyé depuis l’application Radio Monaco');
    setTimeout(function () { merci('mail'); }, 900);
    return true;
  }
  go.textContent = 'Envoi…'; go.style.pointerEvents = 'none';
  var fd = new FormData(); Object.keys(v).forEach(function (k) { fd.append(k, v[k]); });
  fetch(cur.envoi, { method: 'POST', body: fd, mode: 'no-cors' }).then(function () { merci('ok'); }, function () {
    go.style.pointerEvents = ''; go.textContent = 'Valider mon inscription'; er.textContent = 'L’envoi a échoué. Vérifiez votre connexion et réessayez.';
  });
  return false;
}
function merci(mode) {
  ecran(cur, '<span style="width:36px"></span><span>' + esc(cur.t) + '</span><button class="x" id="x" aria-label="Fermer">' + XI + '</button>',
    '<div class="ok"><i><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#121015" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>' +
    (mode === 'mail'
      ? '<h3>Plus qu’un geste, <b>' + esc(memo.prenom || '') + '.</b></h3><p>Votre e-mail d’inscription est prêt : envoyez-le depuis Mail pour valider votre participation.'
      : '<h3>C’est noté, <b>' + esc(memo.prenom || '') + '.</b></h3><p>Votre inscription est enregistrée. Si vous gagnez, nous vous prévenons par e-mail et à l’antenne.') +
    (mode === 'exemple' ? '<br><br><em>Jeu d’exemple : rien n’a été envoyé.</em>' : '') + '</p></div>',
    '<div class="ft"><button class="go" id="ferme">Fermer</button></div>');
}

/* ---------- les touchers ---------- */
document.addEventListener('click', function (e) {
  var a = e.target.closest('[data-id]');
  if (a && a.closest('#ls')) {
    e.preventDefault(); var id = a.getAttribute('data-id'), j = JEUX.filter(function (x) { return x.id === id; })[0];
    [].forEach.call(document.querySelectorAll('#ls .r.on'), function (r) { r.classList.remove('on'); });
    a.classList.add('on'); setTimeout(function () { ouvrir(j); }, 420); return;
  }
  if (e.target.closest('#x,#ferme,#dim')) { e.preventDefault(); fermer(); return; }
  if (e.target.closest('#ins')) { e.preventDefault(); inscription(cur); return; }
  if (e.target.closest('#ret')) { e.preventDefault(); ouvrir(cur); return; }
  if (e.target.closest('a#go')) { if (!valider()) e.preventDefault(); }
});
document.addEventListener('input', function (e) { var f = e.target.closest('.f'); if (f) f.classList.remove('ko'); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && cur) fermer(); });

/* ---------- les données ---------- */
function charge(list) {
  JEUX = (list && list.length ? list : EXEMPLE).map(function (j, n) { j.id = j.id || 'jeu-' + n; return j; });
  render(); clearInterval(timer); timer = setInterval(tick, 30000);
}
fetch(BASE + 'app-une.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
  .then(function (d) { charge(d.jeux); }, function () { charge(null); });
})();
</script>
</body>
</html>
