<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeux</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<style type="text/css">
/* Section « Jeux » (22 novembre 2026) : page d'attente, à remplir avec les jeux à l'antenne. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#F6F3EE;font-family:Barlow,system-ui,sans-serif;color:#141218}
.w{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 32px}
.w img{width:64px;height:64px;border-radius:16px;margin-bottom:22px}
h1{font-size:30px;font-weight:300;letter-spacing:-.03em;line-height:1.05}
h1 b{display:block;font-weight:600}
p{margin-top:14px;font-size:15px;line-height:1.45;color:#6A6570;max-width:300px}

/* apparition de la page (22 novembre) : les blocs montent en fondu, l'un après l'autre */
@keyframes rmIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rm-in{animation:rmIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms + 60ms)}
@media (prefers-reduced-motion:reduce){.rm-in{animation:none}}
</style>
</head>
<body>
<div class="w rm-in">
  <img src="https://nikoprdn.github.io/RM-test/assets/charte/sigle-montecarlo-invert@3x.png" alt="">
  <h1>Les jeux <b>à l’antenne.</b></h1>
  <p>Bientôt ici : tous les jeux de Radio Monaco, pour tenter votre chance en direct.</p>
</div>
</body>
</html>
