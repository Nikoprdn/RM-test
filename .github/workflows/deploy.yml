# Construit le site Radio Monaco à partir de WordPress + Ausha et le publie sur GitHub Pages.
# Déclencheurs : chaque modification du code, toutes les heures (nouveaux articles / podcasts),
# à la main (onglet Actions) et instantanément depuis WordPress (repository_dispatch « wp-publish »).
# Si WordPress ou un flux Ausha ne répond pas, la construction échoue et la version en ligne reste en place.
name: Site Radio Monaco

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [wp-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Préproduction : nikoprdn.github.io/RM-test, non indexée.
  # À la bascule sur le domaine : SITE_URL=https://radio-monaco.com, BASE_PATH=/, INDEXABLE=1
  SITE_URL: https://nikoprdn.github.io
  BASE_PATH: /RM-test
  INDEXABLE: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rm-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rm-site/package-lock.json
      - run: npm ci
      # les images sont dans le dossier assets/ à la racine du dépôt
      - name: Images
        run: mkdir -p public/assets && cp ../assets/* public/assets/
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rm-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
